<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-tc/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-tc/900.css">
<style>
@font-face{font-family:Anton;src:url(node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2)}
@font-face{font-family:Yellowtail;src:url(node_modules/@fontsource/yellowtail/files/yellowtail-latin-400-normal.woff2)}
@font-face{font-family:Poppins;font-weight:500;src:url(node_modules/@fontsource/poppins/files/poppins-latin-500-normal.woff2)}
@font-face{font-family:Poppins;font-weight:600;src:url(node_modules/@fontsource/poppins/files/poppins-latin-600-normal.woff2)}
@font-face{font-family:Poppins;font-weight:700;src:url(node_modules/@fontsource/poppins/files/poppins-latin-700-normal.woff2)}
@font-face{font-family:Poppins;font-weight:800;src:url(node_modules/@fontsource/poppins/files/poppins-latin-800-normal.woff2)}
@font-face{font-family:DMSerif;src:url(node_modules/@fontsource/dm-serif-display/files/dm-serif-display-latin-400-italic.woff2)}
:root{
  --navy:#0E1A3F; --navy2:#1A2C66; --cream:#FFF4E2; --coral:#FF6B5B; --pink:#FF9DAC;
  --mint:#5FD9BC; --gold:#FFC857;
  --bam:#23946A; --bamd:#14684A; --dot:#2C5BC0; --red:#D8343C; --ink:#1C2752;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1500px;height:1125px;overflow:hidden;background:var(--navy)}
#c{position:relative;width:1500px;height:1125px;overflow:hidden;font-family:Poppins,sans-serif;color:var(--cream);
  background:
    radial-gradient(900px 700px at 1060px 560px, rgba(80,120,255,.30), transparent 70%),
    radial-gradient(600px 500px at 160px 120px, rgba(255,107,91,.16), transparent 70%),
    linear-gradient(160deg,#16255A 0%,#0E1A3F 55%,#0A1330 100%)}
.pattern{position:absolute;inset:0;opacity:.07;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='90' height='90'><g fill='none' stroke='%23FFF4E2' stroke-width='1.4'><circle cx='45' cy='45' r='14'/><circle cx='45' cy='45' r='5'/><circle cx='0' cy='0' r='14'/><circle cx='90' cy='0' r='14'/><circle cx='0' cy='90' r='14'/><circle cx='90' cy='90' r='14'/></g></svg>")}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 55% 50%,transparent 55%,rgba(3,6,20,.55) 100%)}

/* ---------- left copy ---------- */
.copy{position:absolute;left:84px;top:78px;width:760px;z-index:30}
.kicker{display:flex;align-items:center;gap:16px;font:700 21px Poppins;letter-spacing:.26em;color:var(--mint)}
.kicker i{display:block;width:46px;height:3px;border-radius:2px;background:var(--mint)}
.script{font:118px/1 Yellowtail;color:var(--coral);transform:rotate(-6deg);transform-origin:left bottom;
  margin:20px 0 -46px 6px;text-shadow:0 6px 0 rgba(10,19,48,.55);position:relative;z-index:2}
.title{font:200px/.88 Anton;letter-spacing:.005em;text-transform:uppercase;color:var(--cream);
  text-shadow:0 10px 0 rgba(5,10,30,.45)}
.title .t2{display:flex;align-items:center;gap:34px}
.fit{display:inline-block;white-space:nowrap}
.stat{display:inline-flex;align-items:center;gap:22px;margin-top:40px;padding:20px 34px 20px 28px;border-radius:28px;line-height:normal;white-space:nowrap;background:rgba(255,244,226,.07);border:2px solid rgba(255,244,226,.14)}
.stat .num{font:132px/.8 Anton;color:var(--gold);text-shadow:0 8px 0 rgba(5,10,30,.45)}
.stat .lbl{display:flex;flex-direction:column;gap:10px}
.stat .lbl b{font:800 40px/1 Poppins;letter-spacing:.04em;color:var(--cream)}
.stat .lbl span{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;font:700 22px Poppins;letter-spacing:.08em;
  color:var(--navy);background:var(--mint);padding:7px 16px;border-radius:30px}
.feats{position:absolute;left:84px;top:842px;display:grid;grid-template-columns:350px 380px;gap:26px 30px;z-index:30}
.feat{display:flex;align-items:center;gap:16px;font:600 27px/1.15 Poppins;color:#EEF0FA;white-space:nowrap}
.feat .ck{flex-shrink:0;width:56px;height:56px;border-radius:13px;display:grid;place-items:center;background:var(--coral);color:#fff;
  box-shadow:0 6px 0 #B9443A}
.feat .ck svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* ---------- sheets ---------- */
.sheet{position:absolute;width:560px;height:725px;background:#FFFDF8;border-radius:6px;
  box-shadow:0 2px 0 #E9E2D2,0 30px 60px rgba(0,0,0,.45),0 8px 18px rgba(0,0,0,.25);padding:26px 30px}
.sheet .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.sheet .hd .brand{font:24px DMSerif;color:var(--bamd)}
.sheet .hd .meta{font:700 11px Poppins;letter-spacing:.14em;color:#8A8FA6}
.sheet .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:0;border-top:1.5px dashed #C9CCD8;border-left:1.5px dashed #C9CCD8}
.sheet .cell{border-right:1.5px dashed #C9CCD8;border-bottom:1.5px dashed #C9CCD8;padding:5px;aspect-ratio:1/1.24;position:relative}
.sheet .cell.gone{background:repeating-linear-gradient(135deg,#F1ECE0 0 6px,#FBF8F1 6px 12px)}
.sheet .ft{margin-top:12px;font:600 11px Poppins;color:#9AA0B4;text-align:center;letter-spacing:.04em}
.mini{width:100%;height:100%;border-radius:7px;background:#FFFBF0;box-shadow:inset 0 0 0 1.4px #BFD9CB}
.mini svg{width:100%;height:100%;display:block}

/* ---------- lifted tiles ---------- */
.tile{position:absolute;width:var(--w);height:calc(var(--w) * 1.29);border-radius:calc(var(--w) * .1);
  background:linear-gradient(165deg,#FFFFFB 0%,#FFF8EA 55%,#F6ECD6 100%);
  box-shadow:
    inset 0 0 0 calc(var(--w) * .012) #fff,
    0 calc(var(--w) * .022) 0 #E6DAC0,
    0 calc(var(--w) * .03) 0 #D4C6A6,
    0 calc(var(--w) * .16) calc(var(--w) * .12) rgba(2,6,24,.42),
    0 calc(var(--w) * .38) calc(var(--w) * .36) rgba(2,6,24,.30)}
.tile .fr{position:absolute;inset:calc(var(--w) * .055);border-radius:calc(var(--w) * .07);border:calc(var(--w) * .012) solid rgba(35,148,106,.55)}
.tile svg{position:absolute;inset:0;width:100%;height:100%}
.tile.hero{box-shadow:
    inset 0 0 0 calc(var(--w) * .012) #fff,
    0 calc(var(--w) * .022) 0 #E6DAC0,
    0 calc(var(--w) * .03) 0 #D4C6A6,
    0 0 0 calc(var(--w) * .035) rgba(255,200,87,.0),
    0 calc(var(--w) * .16) calc(var(--w) * .12) rgba(2,6,24,.42),
    0 calc(var(--w) * .4) calc(var(--w) * .4) rgba(2,6,24,.32),
    0 0 calc(var(--w) * .5) rgba(255,200,87,.45)}
.cut{position:absolute;color:var(--coral)}
.cut svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cutline{position:absolute;border-top:4px dashed var(--coral);transform-origin:left center}

/* ---------- badge ---------- */
.badge{position:absolute;width:250px;height:250px;transform-origin:center}
.badge .disc{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FF8A7D,#FF6B5B 55%,#E2483A);
  box-shadow:0 0 0 8px rgba(255,107,91,.22),0 22px 40px rgba(0,0,0,.4)}
.badge svg.ring{position:absolute;inset:0}
.badge .mid{position:absolute;inset:62px;border-radius:50%;background:var(--cream);display:grid;place-items:center;text-align:center;color:var(--coral);
  box-shadow:inset 0 0 0 4px rgba(255,107,91,.25)}
.badge .mid b{display:block;font:30px/1 Anton;letter-spacing:.04em;color:var(--ink)}
.badge .mid svg{width:42px;height:42px;stroke:var(--coral);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.spark{position:absolute;color:var(--gold)}
</style>
</head>
<body>
<div id="c">
  <div class="pattern"></div>
  <div id="art"></div>
  <div class="copy">
    <div class="kicker"><i></i>COMPLETE AMERICAN SET</div>
    <div class="script">Printable</div>
    <div class="title"><div class="fit" data-w="715">Mahjong</div>
      <div class="t2"><span>Tiles</span></div></div>
    <div class="stat"><div class="num">152</div><div class="lbl"><b>GAME TILES</b><span>+ 8 SPARE TILES</span></div></div>
  </div>
    <div class="feats">
      <div class="feat"><div class="ck">{{palette}}</div>Color + Ink-Saver</div>
      <div class="feat"><div class="ck">{{copy}}</div>Single or Double-Sided</div>
      <div class="feat"><div class="ck">{{zoom-in}}</div>Large Print Included</div>
      <div class="feat"><div class="ck">{{file-text}}</div>US Letter + A4</div>
    </div>
  <div class="vignette"></div>
</div>

<script>
const NUM = ['','一','二','三','四','五','六','七','八','九'];
const C = {bam:'#23946A', bamd:'#14684A', dot:'#2C5BC0', red:'#D8343C', ink:'#1C2752', coral:'#EE6A4D', pink:'#F49BA8', gold:'#E8A93A'};

// ---- tile artwork, viewBox 0 0 100 129 ----
function idx(t, col) { return `<text x="11" y="21" font-family="Poppins" font-weight="800" font-size="13" fill="${col}">${t}</text>`; }
function stick(x, y, h, col) {
  const w = 8.5, d = col === C.red ? '#9E1F26' : C.bamd;
  return `<g><rect x="${x - w / 2}" y="${y}" width="${w}" height="${h}" rx="4.2" fill="${col}"/>
    <rect x="${x - w / 2 + 1.6}" y="${y + 2}" width="2.2" height="${h - 4}" rx="1.1" fill="#fff" opacity=".35"/>
    <rect x="${x - w / 2 - .8}" y="${y + h / 2 - 1.4}" width="${w + 1.6}" height="2.8" rx="1.4" fill="${d}"/>
    <rect x="${x - w / 2 - .8}" y="${y - .5}" width="${w + 1.6}" height="2.6" rx="1.3" fill="${d}"/>
    <rect x="${x - w / 2 - .8}" y="${y + h - 2.1}" width="${w + 1.6}" height="2.6" rx="1.3" fill="${d}"/></g>`;
}
function bams(n) {
  const L = {2: [[50,30],[50,72]], 3: [[50,30],[34,72],[66,72]], 4: [[36,30],[64,30],[36,72],[64,72]],
    5: [[30,30],[70,30],[50,51,'r'],[30,72],[70,72]], 6: [[28,30],[50,30],[72,30],[28,72],[50,72],[72,72]],
    7: [[50,22,'r'],[28,52],[50,52],[72,52],[28,86],[50,86],[72,86]],
    8: [[24,30],[41,30],[59,30],[76,30],[24,72],[41,72],[59,72],[76,72]],
    9: [[28,20],[50,20,'r'],[72,20],[28,53],[50,53,'r'],[72,53],[28,86],[50,86,'r'],[72,86]]}[n];
  const h = n >= 7 ? 28 : 36;
  return idx(n, C.bam) + L.map(([x, y, r]) => stick(x, y + (n >= 7 ? 2 : 4), h, r ? C.red : C.bam)).join('');
}
function bird() {
  return idx(1, C.bam) + `<g>
    <rect x="18" y="92" width="64" height="7" rx="3.5" fill="${C.bam}"/><rect x="18" y="92" width="64" height="2.2" rx="1.1" fill="#fff" opacity=".35"/>
    <rect x="44" y="91" width="3" height="9" rx="1.5" fill="${C.bamd}"/>
    <path d="M30 84 C 14 92, 10 104, 12 114 C 22 106, 28 98, 36 90 Z" fill="${C.dot}"/>
    <path d="M33 86 C 22 98, 22 110, 26 118 C 32 106, 36 98, 40 90 Z" fill="${C.coral}"/>
    <path d="M37 87 C 32 100, 34 112, 40 118 C 42 104, 43 96, 44 89 Z" fill="${C.gold}"/>
    <ellipse cx="52" cy="70" rx="22" ry="20" fill="${C.bam}"/>
    <ellipse cx="57" cy="76" rx="12" ry="12" fill="#BFE8D2"/>
    <path d="M40 66 C 48 58, 62 64, 62 76 C 54 86, 42 84, 38 76 Z" fill="${C.bamd}"/>
    <path d="M44 70 C 49 67, 55 69, 57 74" stroke="#BFE8D2" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="62" cy="50" r="13" fill="${C.bam}"/>
    <path d="M58 38 C 56 30, 62 28, 64 36 C 66 28, 72 30, 68 39 Z" fill="${C.coral}"/>
    <path d="M73 49 L 85 53 L 73 56 Z" fill="${C.gold}"/>
    <circle cx="66" cy="48" r="3.4" fill="#fff"/><circle cx="66.8" cy="48.3" r="1.9" fill="${C.ink}"/>
    <circle cx="61" cy="56" r="2.6" fill="${C.pink}" opacity=".9"/>
    <path d="M50 88 L 48 94 M 58 88 L 58 94" stroke="${C.gold}" stroke-width="2.4" stroke-linecap="round"/></g>`;
}
function dotc(x, y, r, col) {
  return `<g><circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="${col}" stroke-width="${r * .22}"/>
    <circle cx="${x}" cy="${y}" r="${r * .5}" fill="${col}"/><circle cx="${x}" cy="${y}" r="${r * .18}" fill="#fff"/></g>`;
}
function dots(n) {
  if (n === 1) {
    let ring = '';
    for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2; ring += `<circle cx="${50 + Math.cos(a) * 30}" cy="${66 + Math.sin(a) * 30}" r="3.6" fill="${i % 2 ? C.dot : '#7FA4E8'}"/>`; }
    let pet = '';
    for (let i = 0; i < 8; i++) { const a = i / 8 * 360; pet += `<ellipse cx="50" cy="55" rx="4.6" ry="9" fill="${C.coral}" transform="rotate(${a} 50 66)"/>`; }
    return idx(1, C.dot) + `<circle cx="50" cy="66" r="37" fill="#fff" stroke="${C.dot}" stroke-width="3"/>${ring}
      <circle cx="50" cy="66" r="22" fill="#EAF1FF"/>${pet}<circle cx="50" cy="66" r="5.5" fill="${C.gold}"/>`;
  }
  const P = {2: [[50,40],[50,92]], 3: [[28,30],[50,66],[72,102]], 4: [[32,42],[68,42],[32,90],[68,90]],
    5: [[30,36],[70,36],[50,66,'r'],[30,96],[70,96]], 6: [[34,30],[66,30],[34,66,'r'],[66,66,'r'],[34,102,'r'],[66,102,'r']],
    7: [[26,24],[50,34],[74,44],[34,76,'r'],[66,76,'r'],[34,106,'r'],[66,106,'r']],
    8: [[34,24],[66,24],[34,51],[66,51],[34,78],[66,78],[34,105],[66,105]],
    9: [[26,30],[50,30],[74,30],[26,66,'r'],[50,66,'r'],[74,66,'r'],[26,102],[50,102],[74,102]]}[n];
  const r = n <= 2 ? 17 : n <= 4 ? 14 : n <= 6 ? 12 : 10;
  return idx(n, C.dot) + P.map(([x, y, rr]) => dotc(x, y, r, rr ? C.red : (n === 4 || n === 8 ? (y < 60 ? C.dot : C.bam) : C.dot))).join('');
}
function crak(n) {
  return idx(n, C.ink) + `<text x="50" y="62" text-anchor="middle" font-family="Noto Serif TC" font-weight="900" font-size="40" fill="${C.ink}">${NUM[n]}</text>
    <text x="50" y="110" text-anchor="middle" font-family="Noto Serif TC" font-weight="900" font-size="42" fill="${C.red}">萬</text>`;
}
function wind(ch, l) {
  return idx(l, C.ink) + `<text x="50" y="86" text-anchor="middle" font-family="Noto Serif TC" font-weight="900" font-size="58" fill="${C.ink}">${ch}</text>`;
}
function dragon(kind) {
  if (kind === 'red') return idx('D', C.red) + `<text x="50" y="84" text-anchor="middle" font-family="Noto Serif TC" font-weight="900" font-size="62" fill="${C.red}">中</text>
    <path d="M30 100 H70" stroke="${C.red}" stroke-width="1.6" opacity=".5"/><text x="50" y="114" text-anchor="middle" font-family="Poppins" font-weight="700" font-size="8.5" letter-spacing="1.5" fill="${C.red}">RED DRAGON</text>`;
  if (kind === 'green') return idx('D', C.bam) + `<text x="50" y="84" text-anchor="middle" font-family="Noto Serif TC" font-weight="900" font-size="56" fill="${C.bam}">發</text>
    <path d="M30 100 H70" stroke="${C.bam}" stroke-width="1.6" opacity=".5"/><text x="50" y="114" text-anchor="middle" font-family="Poppins" font-weight="700" font-size="8.5" letter-spacing="1.5" fill="${C.bam}">GREEN DRAGON</text>`;
  return idx('D', C.dot) + `<rect x="24" y="32" width="52" height="66" rx="5" fill="none" stroke="${C.dot}" stroke-width="4"/>
    <rect x="31" y="39" width="38" height="52" rx="3" fill="none" stroke="${C.dot}" stroke-width="1.6"/>
    <path d="M50 54 L 56 65 L 50 76 L 44 65 Z" fill="${C.dot}"/><text x="50" y="114" text-anchor="middle" font-family="Poppins" font-weight="700" font-size="8.5" letter-spacing="1.5" fill="${C.dot}">SOAP</text>`;
}
function flower() {
  const bloom = (x, y, s) => {
    let p = '';
    for (let i = 0; i < 5; i++) p += `<ellipse cx="${x}" cy="${y - 7 * s}" rx="${5.5 * s}" ry="${7.5 * s}" fill="${C.pink}" transform="rotate(${i * 72} ${x} ${y})"/>`;
    return p + `<circle cx="${x}" cy="${y}" r="${3.6 * s}" fill="${C.coral}"/><circle cx="${x}" cy="${y}" r="${1.5 * s}" fill="${C.gold}"/>`;
  };
  return idx('F', C.coral) + `<path d="M20 108 C 38 96, 44 80, 60 70 C 70 64, 76 54, 80 40" stroke="#6B4A3A" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M46 86 C 40 76, 34 72, 26 70" stroke="#6B4A3A" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="66" cy="84" rx="5" ry="9" fill="${C.bam}" transform="rotate(40 66 84)"/>
    ${bloom(72, 46, 1.25)}${bloom(32, 68, 1.0)}${bloom(56, 74, .8)}
    <circle cx="82" cy="34" r="3" fill="${C.pink}"/><circle cx="22" cy="60" r="2.4" fill="${C.pink}"/>
    <text x="50" y="118" text-anchor="middle" font-family="Poppins" font-weight="700" font-size="8.5" letter-spacing="1.5" fill="${C.coral}">FLOWER</text>`;
}
function joker() {
  const cols = [C.red, C.dot, C.bam, C.gold, C.coral];
  const letters = 'JOKER'.split('').map((ch, i) => `<text x="${22 + i * 14}" y="98" text-anchor="middle" font-family="Anton" font-size="27" fill="${cols[i]}" transform="rotate(${(i - 2) * 5} ${22 + i * 14} 90)">${ch}</text>`).join('');
  let rays = '';
  for (let i = 0; i < 12; i++) rays += `<path d="M50 50 L ${50 + Math.cos(i / 12 * 6.283) * 34} ${50 + Math.sin(i / 12 * 6.283) * 34} L ${50 + Math.cos((i + .5) / 12 * 6.283) * 34} ${50 + Math.sin((i + .5) / 12 * 6.283) * 34} Z" fill="${C.gold}" opacity="${i % 2 ? .18 : .32}"/>`;
  return `${rays}<path d="M50 24 L 56.5 41 L 74 42 L 60 53 L 65 70 L 50 60 L 35 70 L 40 53 L 26 42 L 43.5 41 Z" fill="${C.gold}" stroke="#C98B1C" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="50" cy="50" r="4" fill="#fff" opacity=".8"/>${letters}
    <circle cx="20" cy="22" r="2.6" fill="${C.coral}"/><circle cx="82" cy="24" r="2.2" fill="${C.dot}"/><circle cx="84" cy="112" r="2.6" fill="${C.bam}"/><circle cx="16" cy="110" r="2.2" fill="${C.gold}"/>`;
}
function art(spec) {
  const [s, v] = spec.split(':');
  const body = s === 'bam' ? (+v === 1 ? bird() : bams(+v)) : s === 'dot' ? dots(+v) : s === 'crak' ? crak(+v) :
    s === 'wind' ? wind(...v.split('')) : s === 'drag' ? dragon(v) : s === 'flower' ? flower() : joker();
  return `<svg viewBox="0 0 100 129">${body}</svg>`;
}

// ---- scene ----
const A = document.getElementById('art');
function sheet({x, y, rot, brand, meta, tiles, gone = [], z}) {
  const d = document.createElement('div'); d.className = 'sheet';
  d.style.cssText = `left:${x}px;top:${y}px;transform:rotate(${rot}deg);z-index:${z}`;
  d.innerHTML = `<div class="hd"><div class="brand">${brand}</div><div class="meta">${meta}</div></div>
    <div class="grid">${tiles.map((t, i) => gone.includes(i) ? `<div class="cell gone"></div>` : `<div class="cell"><div class="mini">${art(t)}</div></div>`).join('')}</div>
    <div class="ft">The Mahj Parlor · Print at 100% · each tile 1.2 × 1.55 in</div>`;
  A.appendChild(d); return d;
}
function tile(spec, x, y, w, rot, z, hero) {
  const d = document.createElement('div'); d.className = 'tile' + (hero ? ' hero' : '');
  d.style.cssText = `--w:${w}px;left:${x - w / 2}px;top:${y - w * 1.29 / 2}px;transform:rotate(${rot}deg);z-index:${z}`;
  d.innerHTML = `<div class="fr"></div>${art(spec)}`; A.appendChild(d);
}
const rep = (arr, k) => arr.flatMap(a => Array(k).fill(a));
const bamTiles = rep([1,2,3,4,5,6,7,8,9].map(n => 'bam:' + n), 4);
const dotTiles = rep([1,2,3,4,5,6,7,8,9].map(n => 'dot:' + n), 4);
const honorTiles = [...rep(['wind:東E', 'wind:南S', 'wind:西W', 'wind:北N'], 4), ...rep(['drag:red', 'drag:green', 'drag:soap'], 4), ...rep(['flower'], 8)];

sheet({x: 1000, y: 140, rot: 8, brand: 'The Mahj Parlor', meta: 'SHEET 2 OF 5 — DOTS · 36 TILES', tiles: dotTiles, z: 1});
sheet({x: 880, y: 214, rot: -9, brand: 'The Mahj Parlor', meta: 'SHEET 4 OF 5 — HONORS · 36 TILES', tiles: honorTiles, z: 2});
