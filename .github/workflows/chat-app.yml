# Tests the ChatGPT website and puts a ready-to-run zip on the Releases page.
name: ChatGPT website

on:
  push:
    paths:
      - 'chat-app/**'
      - '.github/workflows/chat-app.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chat-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        working-directory: chat-app
        run: npm test
      - name: Single-file index.html is up to date
        working-directory: chat-app
        run: node scripts/build-static.mjs && git diff --exit-code website/index.html

  # The single-file website against the real free AI (no mock): does it answer and draw?
  live-ai:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Website answers and makes images in Chrome
        working-directory: chat-app
        run: |
          npm i --no-save --no-package-lock playwright-core@1.49.1
          node scripts/live-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-check-screenshot
          path: chat-app/live-check.png
          if-no-files-found: ignore

  # The same image Render / Railway / a VPS build: run it like a hosting service would.
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t chatgpt chat-app
      - name: Run like a hosting service (own PORT) and check sign up + chat
        run: |
          docker run -d --name site -e PORT=10000 -e ENABLE_MOCK=1 -e OMNIROUTE_BASE_URL=off -p 10000:10000 chatgpt
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:10000/healthz && break; sleep 1; done
          curl -fs -c jar -H 'Content-Type: application/json' -d '{"email":"ci@test.dev","password":"password123"}' http://127.0.0.1:10000/api/auth/signup
          curl -fs -b jar -H 'Content-Type: application/json' -d '{"content":"hello"}' http://127.0.0.1:10000/api/chat | grep -q 'event: done'
          sleep 35
          test "$(docker inspect -f '{{.State.Health.Status}}' site)" = healthy
          echo "Docker image OK"

  website:
    needs: [test, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package the website
        run: |
          mkdir -p out/ChatGPT
          cd chat-app
          cp -r server public package.json .env.example Start-ChatGPT.bat start-chatgpt.sh \
            Dockerfile .dockerignore docker-compose.yml Caddyfile install.sh DEPLOY.md ../out/ChatGPT/
          cd ../out
          zip -qr ../ChatGPT-Website.zip ChatGPT
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: website-latest
          name: ChatGPT (website)
          target_commitish: ${{ github.sha }}
          files: |
            chat-app/website/index.html
            ChatGPT-Website.zip
          body: |
            **Single file:** `index.html` — upload it to any website host (Netlify Drop, GitHub Pages…) and you get a link.
            Sign up works in the browser; AI works without keys (Pollinations), optional free keys at the top of the file.

            **Live on the internet (phone + PC, sign up for everyone):** follow `DEPLOY.md` inside the zip —
            Render (free), Railway, or your own server with `install.sh`.

            **Only on this PC:** unzip, double-click `Start-ChatGPT.bat` (Mac/Linux: `start-chatgpt.sh`),
            the browser opens http://localhost:3000.
