# Tests the ChatGPT Pro website and puts a ready-to-run zip on the Releases page.
name: ChatGPT Pro website

on:
  push:
    paths:
      - 'chat-app/**'
      - '.github/workflows/chat-app.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chat-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        working-directory: chat-app
        run: npm test

  website:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package the website
        run: |
          mkdir -p out/ChatGPT-Pro
          cd chat-app
          cp -r server public package.json .env.example Start-ChatGPT-Pro.bat start-chatgpt-pro.sh ../out/ChatGPT-Pro/
          cd ../out
          zip -qr ../ChatGPT-Pro-Website.zip ChatGPT-Pro
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: website-latest
          name: ChatGPT Pro (website)
          target_commitish: ${{ github.sha }}
          files: ChatGPT-Pro-Website.zip
          body: |
            1. Download `ChatGPT-Pro-Website.zip` and unzip it.
            2. Windows: double-click `Start-ChatGPT-Pro.bat` · Mac/Linux: run `start-chatgpt-pro.sh`.
            3. Your browser opens http://localhost:3000 — sign up and chat.

            Needs Node.js 22+ (the start file opens the download page if it is missing).
            AI comes from OmniRoute on the same computer (localhost:20128): connect free providers there.
