# Builds the ChatGPT desktop app for Windows, macOS and Linux and puts the
# installers on the repository's Releases page ("ChatGPT desktop app").
name: ChatGPT app

on:
  push:
    paths:
      - 'chat-app/**'
      - '.github/workflows/chat-app.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chat-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Server tests
        working-directory: chat-app
        run: npm test

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: chat-app/desktop/dist/*.exe
          - os: macos-latest
            script: dist:mac
            files: chat-app/desktop/dist/*.dmg
          - os: ubuntu-latest
            script: dist:linux
            files: chat-app/desktop/dist/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: chat-app/desktop
        run: npm ci
      - name: Build installer
        working-directory: chat-app/desktop
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      # Signing key: created once, kept only in this repository's private Actions cache.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android-signing
          key: android-signing-v1
      - name: Prepare signing key
        run: |
          mkdir -p ~/.android-signing
          if [ ! -f ~/.android-signing/release.p12 ]; then
            openssl rand -hex 24 > ~/.android-signing/pass
            P=$(cat ~/.android-signing/pass)
            keytool -genkeypair -keystore ~/.android-signing/release.p12 -storetype PKCS12 -alias chatgpt \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass "$P" -keypass "$P" -dname "CN=ChatGPT Personal"
          fi
          P=$(cat ~/.android-signing/pass)
          echo "::add-mask::$P"
          echo "ANDROID_KEYSTORE=$HOME/.android-signing/release.p12" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$P" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: chat-app/android
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Name the APK
        run: cp chat-app/android/app/build/outputs/apk/release/app-release.apk ChatGPT-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Android
          path: ChatGPT-Android.apk
          if-no-files-found: error

  release:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: chatgpt-desktop-latest
          name: ChatGPT app (PC + Android)
          target_commitish: ${{ github.sha }}
          files: out/*
          body: |
            Download the file for your computer:
            - **Windows:** `ChatGPT-Setup-1.0.0.exe` → open it (if Windows says "protected your PC": More info → Run anyway).
            - **Mac (Apple chip M1/M2/M3…):** `ChatGPT-1.0.0-arm64.dmg` · **Mac (Intel):** `ChatGPT-1.0.0-x64.dmg` → drag to Applications, then right-click the app → Open.
            - **Linux:** `ChatGPT-1.0.0.AppImage` → make it executable and run.
            - **Android:** `ChatGPT-Android.apk` → open it on the phone and allow "Install unknown apps" once. On first open, enter your ChatGPT address (shown on your PC/server: profile menu → Phone app).
            - **iPhone:** open your ChatGPT address in Safari → Share → Add to Home Screen.

            First launch: create your account (the first account is the admin). The app connects to OmniRoute on your PC by itself — connect free providers (Groq, Gemini, Cerebras) in the OmniRoute dashboard and their models appear in the app.
