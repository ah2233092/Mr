<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0b1214}
#room{position:absolute;inset:0;overflow:hidden;
  background:
    radial-gradient(900px 700px at 1500px 380px, rgba(255,170,90,.10), transparent 70%),
    linear-gradient(180deg,#121b1e 0%,#0d1416 60%,#090e10 100%)}
.unit{position:absolute;top:-40px;bottom:-40px;background:#1c120c;box-shadow:0 0 0 1px #000}
.shelf{position:absolute;left:0;right:0;overflow:hidden;background:linear-gradient(180deg,#120b07,#1a110b 40%,#22160e)}
.board{position:absolute;left:-4px;right:-4px;height:22px;background:linear-gradient(180deg,#5a3a24,#3a2516 45%,#1c120b);box-shadow:0 6px 14px rgba(0,0,0,.7)}
.book{position:absolute;bottom:0;border-radius:2px 2px 0 0;filter:brightness(.72) saturate(.85)}
.book i{position:absolute;left:0;right:0;height:3px;opacity:.55}
.led{position:absolute;left:0;right:0;top:0;height:100%;pointer-events:none;
  background:radial-gradient(120% 70% at 50% -8%, rgba(255,200,130,.85), rgba(255,160,80,.22) 40%, transparent 72%);mix-blend-mode:screen}
.shade{position:absolute;left:0;right:0;bottom:0;height:70%;background:linear-gradient(0deg,rgba(0,0,0,.72),transparent)}
.upright{position:absolute;top:-40px;bottom:-40px;width:26px;background:linear-gradient(90deg,#2d1d12,#4a3020 50%,#22150d)}
.glow{position:absolute;border-radius:50%;mix-blend-mode:screen}
.bulb{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff6dd 0%,#ffd28a 35%,rgba(255,170,80,0) 70%)}
.haze{position:absolute;inset:0;background:radial-gradient(60% 80% at 15% 40%, rgba(90,140,160,.18), transparent 70%)}
</style></head>
<body><div id="room"></div>
<script>
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const R = document.getElementById('room');
const PAL = ['#5b1f22','#7a2e25','#1f3550','#24405e','#2d4a36','#3c5a3a','#8c6a2c','#b08a48','#d8cdb4','#c9b99a','#3a2b45','#5e4a6e','#1d1d24','#6b3c26','#a34d2e','#2f5b5b','#e2d6bd','#7d6f5a'];
function shelfUnit(x, w, shelves) {
  const u = document.createElement('div'); u.className = 'unit'; u.style.left = x + 'px'; u.style.width = w + 'px'; R.appendChild(u);
  shelves.forEach(([top, h]) => {
    const s = document.createElement('div'); s.className = 'shelf'; s.style.top = (top + 40) + 'px'; s.style.height = h + 'px'; u.appendChild(s);
    let bx = 8 + rnd() * 10;
    while (bx < w - 20) {
      if (rnd() < .08) { bx += 30 + rnd() * 60; continue; }            // gap / decor space
      const bw = 13 + rnd() * 22, bh = h * (.62 + rnd() * .33), c = PAL[Math.floor(rnd() * PAL.length)];
      const b = document.createElement('div'); b.className = 'book';
      const lean = rnd() < .06 ? (rnd() < .5 ? -8 : 8) : 0;
      b.style.cssText = `left:${bx}px;width:${bw}px;height:${bh}px;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.08) 35%,rgba(0,0,0,.25)),${c};transform:rotate(${lean}deg);transform-origin:bottom ${lean > 0 ? 'left' : 'right'}`;
      for (let k = 0; k < 2; k++) if (rnd() < .6) { const i = document.createElement('i'); i.style.top = (10 + k * (bh * .6)) + 'px'; i.style.background = rnd() < .5 ? '#d9b46a' : '#efe6d0'; b.appendChild(i); }
      s.appendChild(b); bx += bw + (rnd() < .2 ? 2 : 0.5);
    }
    const led = document.createElement('div'); led.className = 'led'; s.appendChild(led);
    const sh = document.createElement('div'); sh.className = 'shade'; s.appendChild(sh);
    const bd = document.createElement('div'); bd.className = 'board'; bd.style.top = (top + 40 + h) + 'px'; u.appendChild(bd);
  });
}
const rows = [[40, 230], [292, 230], [544, 230], [796, 230], [1048, 230]];
// full-width library: three shelving bays, symmetric around the talent
shelfUnit(-30, 660, rows.map(([t, h]) => [t - 20, h]));
shelfUnit(656, 610, rows);
shelfUnit(1292, 660, rows.map(([t, h]) => [t - 20, h]));
[[630], [1266], [1952]].forEach(([x]) => { const d = document.createElement('div'); d.className = 'upright'; d.style.left = x + 'px'; R.appendChild(d); });
// warm practicals: two table lamps far left and far right, a soft glow behind the head
R.insertAdjacentHTML('beforeend', `
  <div class="glow" style="left:-300px;top:500px;width:900px;height:900px;background:radial-gradient(circle,rgba(255,170,90,.30),transparent 65%)"></div>
  <div class="glow" style="left:1320px;top:500px;width:900px;height:900px;background:radial-gradient(circle,rgba(255,170,90,.30),transparent 65%)"></div>
  <div class="glow" style="left:560px;top:-120px;width:800px;height:700px;background:radial-gradient(circle,rgba(255,190,120,.16),transparent 70%)"></div>
  <div style="position:absolute;left:70px;top:860px;width:120px;height:86px;clip-path:polygon(18% 0,82% 0,100% 100%,0 100%);background:linear-gradient(180deg,#f9e2b8,#e6ae66);box-shadow:0 0 80px 30px rgba(255,180,100,.5)"></div>
  <div style="position:absolute;left:1730px;top:860px;width:120px;height:86px;clip-path:polygon(18% 0,82% 0,100% 100%,0 100%);background:linear-gradient(180deg,#f9e2b8,#e6ae66);box-shadow:0 0 80px 30px rgba(255,180,100,.5)"></div>`);
for (let k = 0; k < 40; k++) {
  const b = document.createElement('div'); b.className = 'bulb'; const s = 12 + rnd() * 14;
  b.style.cssText = `left:${rnd() * 1920}px;top:${30 + Math.floor(rnd() * 5) * 252 + 8 + rnd() * 10}px;width:${s}px;height:${s}px;opacity:${.45 + rnd() * .5}`;
  R.appendChild(b);
}

window.ready = document.fonts.ready;
</script></body></html>
