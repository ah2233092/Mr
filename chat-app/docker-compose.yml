# One-command production deploy on any VPS:
#   1. point your domain's DNS A-record to the server IP
#   Easiest:  sudo bash install.sh   (does everything below automatically)
#   Manual:   cp .env.example .env, fill DOMAIN + the OMNIROUTE_* secrets, then docker compose up -d --build
# Caddy gets a free HTTPS certificate automatically.
#
# Stack: Caddy (HTTPS) -> app (chat UI + engine) -> OmniRoute (AI gateway) -> AI providers
# Every service restarts by itself if it ever stops.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - DATA_DIR=/data
      - TRUST_PROXY=true
      # talk to OmniRoute over the private Docker network
      - OMNIROUTE_BASE_URL=${OMNIROUTE_BASE_URL:-http://omniroute:20128/v1}
    volumes:
      - appdata:/data
    depends_on:
      - omniroute

  omniroute:
    # https://github.com/diegosouzapw/OmniRoute — version tested with this app
    image: diegosouzapw/omniroute:3.8.52
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      - OMNIROUTE_MEMORY_MB=${OMNIROUTE_MEMORY_MB:-1024}
      # Security: set these in .env (see .env.example). The default dashboard password is public!
      - INITIAL_PASSWORD=${OMNIROUTE_DASHBOARD_PASSWORD:?set OMNIROUTE_DASHBOARD_PASSWORD in .env}
      - JWT_SECRET=${OMNIROUTE_JWT_SECRET:?set OMNIROUTE_JWT_SECRET in .env}
      - API_KEY_SECRET=${OMNIROUTE_API_KEY_SECRET:?set OMNIROUTE_API_KEY_SECRET in .env}
      - REQUIRE_API_KEY=true
    volumes:
      - omniroute-data:/app/data
    ports:
      # Dashboard only on the server itself. Open it from your PC with an SSH tunnel:
      #   ssh -L 20128:localhost:20128 root@YOUR_SERVER_IP   then visit http://localhost:20128
      - "127.0.0.1:20128:20128"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  appdata:
  omniroute-data:
  caddy_data:
