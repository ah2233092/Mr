<style>
/* ===== Theme tokens ===== */
:root {
  --bg: #ffffff; --sidebar: #f9f9f9; --text: #0d0d0d; --text-2: #5d5d5d; --text-3: #8f8f8f;
  --border: rgba(13,13,13,.10); --border-strong: rgba(13,13,13,.16); --hover: rgba(13,13,13,.05); --active: rgba(13,13,13,.08);
  --bubble: #f4f4f4; --composer: #ffffff; --menu: #ffffff; --code-bg: #f9f9f9; --code-head: #f0f0f0;
  --btn: #0d0d0d; --btn-ink: #ffffff; --danger: #e02e2a; --ok: #10a37f; --link: #2964aa;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.05); --shadow: 0 4px 16px rgba(0,0,0,.08), 0 0 1px rgba(0,0,0,.25);
  --composer-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 4px 18px rgba(0,0,0,.06);
  --scrim: rgba(0,0,0,.35);
  --hl-kw: #a626a4; --hl-str: #50a14f; --hl-num: #986801; --hl-com: #a0a1a7; --hl-fn: #4078f2; --hl-type: #c18401; --hl-attr: #e45649;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #212121; --sidebar: #181818; --text: #ececec; --text-2: #b4b4b4; --text-3: #8f8f8f;
  --border: rgba(255,255,255,.10); --border-strong: rgba(255,255,255,.16); --hover: rgba(255,255,255,.07); --active: rgba(255,255,255,.10);
  --bubble: #303030; --composer: #303030; --menu: #353535; --code-bg: #171717; --code-head: #2f2f2f;
  --btn: #ffffff; --btn-ink: #0d0d0d; --danger: #f2524e; --ok: #19c37d; --link: #7ab7ff;
  --shadow: 0 8px 30px rgba(0,0,0,.45), 0 0 1px rgba(255,255,255,.2);
  --composer-shadow: 0 0 0 1px rgba(255,255,255,.04), 0 4px 18px rgba(0,0,0,.25);
  --scrim: rgba(0,0,0,.55);
  --hl-kw: #c678dd; --hl-str: #98c379; --hl-num: #d19a66; --hl-com: #7f848e; --hl-fn: #61afef; --hl-type: #e5c07b; --hl-attr: #e06c75;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: ui-sans-serif, -apple-system, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
  background: var(--bg); color: var(--text); font-size: 16px; -webkit-font-smoothing: antialiased;
  overflow: hidden; -webkit-tap-highlight-color: transparent;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
[hidden] { display: none !important; }
svg.i { width: 20px; height: 20px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 16px; height: 16px; }
svg.i.lg { width: 24px; height: 24px; }
svg.logo { width: 24px; height: 24px; flex-shrink: 0; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: rgba(127,127,127,.35); border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::selection { background: rgba(41,100,170,.25); }

.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 8px; color: var(--text-2); }
.icon-btn:hover { background: var(--hover); color: var(--text); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; font-weight: 500; font-size: 14px; border: 1px solid var(--border-strong); }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--btn); color: var(--btn-ink); border-color: transparent; }
.btn.primary:hover { opacity: .88; }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
.btn.danger.solid { background: var(--danger); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }

/* ===== Splash ===== */
#splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); z-index: 500; }
#splash svg { width: 48px; height: 48px; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; transform: scale(.94); } }

/* ===== Auth ===== */
#auth { position: fixed; inset: 0; overflow-y: auto; background: var(--bg); z-index: 300; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; }
.auth-brand { align-self: stretch; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 18px; padding: 4px 8px; }
.auth-card { width: 100%; max-width: 360px; margin: auto; padding: 32px 0 48px; text-align: center; }
.auth-card h1 { font-size: 30px; font-weight: 600; margin: 0 0 8px; letter-spacing: -.02em; }
.auth-card .sub { color: var(--text-2); margin: 0 0 24px; font-size: 15px; }
.auth-field { position: relative; margin-bottom: 14px; text-align: left; }
.auth-field input { width: 100%; height: 52px; border-radius: 999px; border: 1px solid var(--border-strong); background: transparent; padding: 0 20px; outline: none; font-size: 16px; }
.auth-field input:focus { border-color: var(--ok); box-shadow: 0 0 0 1px var(--ok); }
.auth-card .btn { width: 100%; height: 52px; font-size: 16px; }
.auth-error { color: var(--danger); font-size: 14px; min-height: 20px; margin: 4px 0 10px; text-align: left; padding-left: 8px; }
.auth-note { color: var(--ok); font-size: 14px; margin: 4px 0 10px; }
.auth-switch { margin-top: 18px; font-size: 14px; color: var(--text-2); }
.auth-switch a, .link { color: var(--link); cursor: pointer; text-decoration: none; }
.auth-switch a:hover, .link:hover { text-decoration: underline; }
.divider { display: flex; align-items: center; gap: 12px; color: var(--text-3); font-size: 12px; margin: 18px 0; text-transform: uppercase; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border-strong); }
.google-btn svg { width: 18px; height: 18px; }
.auth-foot { font-size: 12px; color: var(--text-3); padding-bottom: env(safe-area-inset-bottom); }

/* ===== Layout ===== */
#app { display: flex; height: 100dvh; width: 100%; }
#sidebar { width: 260px; flex-shrink: 0; background: var(--sidebar); display: flex; flex-direction: column; height: 100%; transition: margin-left .2s ease, transform .2s ease; z-index: 60; padding-top: env(safe-area-inset-top); }
#app.collapsed #sidebar { margin-left: -260px; }
.sb-top { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 4px; height: 52px; }
.sb-logo { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 8px; color: var(--text); }
.sb-logo:hover { background: var(--hover); }
.sb-nav { padding: 4px 8px 8px; display: flex; flex-direction: column; gap: 1px; }
.sb-item { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 8px; font-size: 14px; color: var(--text); text-align: left; width: 100%; }
.sb-item:hover { background: var(--hover); }
.sb-item .kbd { margin-left: auto; font-size: 12px; color: var(--text-3); opacity: 0; }
.sb-item:hover .kbd { opacity: 1; }
#chatList { flex: 1; overflow-y: auto; padding: 0 8px 12px; overscroll-behavior: contain; }
.sb-group { font-size: 12px; font-weight: 500; color: var(--text-3); padding: 16px 10px 6px; }
.chat-item { position: relative; display: flex; align-items: center; height: 36px; border-radius: 8px; padding: 0 10px; font-size: 14px; cursor: pointer; color: var(--text); }
.chat-item:hover, .chat-item.menu-open { background: var(--hover); }
.chat-item.active { background: var(--active); }
.chat-item .t { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.chat-item .more { opacity: 0; width: 28px; height: 28px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; color: var(--text-2); margin-right: -6px; }
.chat-item:hover .more, .chat-item.active .more, .chat-item.menu-open .more { opacity: 1; }
.chat-item .more:hover { color: var(--text); }
.chat-item input { flex: 1; min-width: 0; height: 28px; border: 1px solid var(--ok); border-radius: 6px; background: var(--bg); padding: 0 6px; outline: none; font-size: 14px; }
.chat-item .pin { color: var(--text-3); margin-right: 6px; }
.sb-empty { color: var(--text-3); font-size: 13px; padding: 12px 10px; }
.sb-bottom { padding: 8px; border-top: 1px solid var(--border); padding-bottom: max(8px, env(safe-area-inset-bottom)); }
.profile-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; border-radius: 10px; text-align: left; }
.profile-btn:hover { background: var(--hover); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: #7b61ff; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; flex-shrink: 0; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.profile-btn .nm { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.profile-btn .pl { font-size: 12px; color: var(--text-3); }
#scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 55; opacity: 0; pointer-events: none; transition: opacity .2s; }

main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; height: 100%; background: var(--bg); }
#topbar { display: flex; align-items: center; gap: 4px; height: 52px; padding: 0 8px; padding-top: env(safe-area-inset-top); flex-shrink: 0; position: relative; z-index: 20; background: var(--bg); }
#topbar .left-tools { display: none; align-items: center; gap: 2px; }
#app.collapsed #topbar .left-tools { display: flex; }
#modelBtn { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 10px; border-radius: 10px; font-size: 18px; font-weight: 500; }
#modelBtn:hover { background: var(--hover); }
#modelBtn .mname { color: var(--text-2); font-weight: 400; }
#modelBtn svg { color: var(--text-3); }
#topbar .right { margin-left: auto; display: flex; gap: 4px; align-items: center; }
#topbar .mobile-only { display: none; }

#scroller { flex: 1; overflow-y: auto; overflow-x: hidden; scroll-behavior: auto; overscroll-behavior: contain; }
#thread { max-width: 48rem; margin: 0 auto; padding: 8px 20px 32px; }
#composerWrap { flex-shrink: 0; padding: 0 16px; padding-bottom: max(8px, env(safe-area-inset-bottom)); background: var(--bg); position: relative; z-index: 5; }
.composer-inner { max-width: 48rem; margin: 0 auto; }

/* Empty state: greeting + composer centred (desktop) */
#greeting { display: none; text-align: center; font-size: 28px; font-weight: 500; letter-spacing: -.01em; margin: 0 0 28px; padding: 0 16px; }
main.is-empty #greeting { display: block; }
main.is-empty #thread { display: none; }
main.is-empty { justify-content: center; }
main.is-empty #topbar { position: absolute; top: 0; left: 0; right: 0; }
main.is-empty #scroller { flex: 0 0 auto; overflow: visible; }
main.is-empty .disclaimer { visibility: hidden; }
#suggestions { display: none; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 48rem; margin: 16px auto 0; }
main.is-empty #suggestions { display: flex; }
.suggestion { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border: 1px solid var(--border-strong); border-radius: 999px; font-size: 14px; color: var(--text-2); }
.suggestion:hover { background: var(--hover); color: var(--text); }
.suggestion svg { width: 18px; height: 18px; }

/* ===== Composer ===== */
#composer { background: var(--composer); border-radius: 28px; box-shadow: var(--composer-shadow); padding: 10px 10px 10px 12px; display: flex; flex-direction: column; cursor: text; position: relative; }
:root[data-theme="dark"] #composer { box-shadow: none; }
#composer.drag { outline: 2px dashed var(--ok); outline-offset: 2px; }
#input { width: 100%; border: 0; outline: none; background: transparent; resize: none; max-height: 40vh; min-height: 24px; line-height: 24px; font-size: 16px; padding: 4px 8px 6px; overflow-y: auto; }
#input::placeholder { color: var(--text-3); }
.composer-bar { display: flex; align-items: center; gap: 4px; }
.composer-bar .spacer { flex: 1; }
.cbtn { width: 36px; height: 36px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: var(--text); }
.cbtn:hover { background: var(--hover); }
.cbtn.listening { background: var(--danger); color: #fff; animation: pulse 1.4s infinite; }
#sendBtn { background: var(--btn); color: var(--btn-ink); }
#sendBtn:hover { opacity: .85; background: var(--btn); }
#sendBtn:disabled { opacity: .3; cursor: default; }
#sendBtn .stop-ico { display: none; }
#sendBtn.streaming .send-ico { display: none; }
#sendBtn.streaming .stop-ico { display: block; }
.tool-chip { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px 0 12px; border-radius: 999px; color: var(--link); font-size: 14px; font-weight: 500; }
.tool-chip:hover { background: var(--hover); }
.tool-chip .x { display: none; }
.tool-chip:hover .x { display: inline; }
.tool-chip:hover .ico { display: none; }
#attachRow { display: flex; flex-wrap: wrap; gap: 8px; padding: 2px 4px 8px; }
#attachRow:empty { display: none; }
.att { position: relative; display: flex; align-items: center; gap: 8px; border: 1px solid var(--border-strong); border-radius: 14px; padding: 6px 10px 6px 6px; max-width: 240px; font-size: 13px; background: var(--bg); }
.att.img { padding: 0; border-radius: 14px; width: 64px; height: 64px; overflow: hidden; }
.att.img img { width: 100%; height: 100%; object-fit: cover; }
.att .fic { width: 36px; height: 36px; border-radius: 8px; background: #ff5588; color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.att .fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.att .fsub { color: var(--text-3); font-size: 12px; }
.att .rm { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; background: var(--btn); color: var(--btn-ink); display: flex; align-items: center; justify-content: center; border: 2px solid var(--bg); }
.att .rm svg { width: 12px; height: 12px; stroke-width: 2.5; }
.att.loading::after { content: ""; position: absolute; inset: 0; background: color-mix(in srgb, var(--bg) 60%, transparent); }
.disclaimer { text-align: center; color: var(--text-2); font-size: 12px; padding: 8px 0 2px; min-height: 26px; }

#toBottom { position: absolute; left: 50%; transform: translateX(-50%); bottom: 150px; width: 34px; height: 34px; border-radius: 50%; background: var(--bg); border: 1px solid var(--border-strong); box-shadow: var(--shadow-sm); display: flex; align-items: center; justify-content: center; z-index: 10; color: var(--text); }

/* ===== Messages ===== */
.msg { margin: 0 0 24px; position: relative; }
.msg.user { display: flex; flex-direction: column; align-items: flex-end; margin-top: 24px; }
.msg.user .bubble { background: var(--bubble); border-radius: 18px; padding: 10px 16px; max-width: 70%; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; line-height: 1.6; }
.msg.user .u-atts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-bottom: 8px; max-width: 80%; }
.msg.user .u-atts img { max-width: 220px; max-height: 220px; border-radius: 14px; object-fit: cover; cursor: zoom-in; display: block; }

<!-- ============ AUTH ============ -->
<div id="auth" hidden>
  <div class="auth-brand"><svg class="logo"><use href="#logo"/></svg><span class="app-name">ChatGPT</span></div>
  <div class="auth-card">
    <h1 id="authTitle">Welcome back</h1>
    <p class="sub" id="authSub">Log in to continue</p>
    <button class="btn google-btn" id="googleBtn" type="button" hidden>
      <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2 1.5-4.5 2.4-7.2 2.4-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      Continue with Google
    </button>
    <div class="divider" id="authDivider" hidden>or</div>
    <form id="authForm" novalidate>
      <div class="auth-field" id="nameField" hidden><input id="authName" type="text" placeholder="Your name" autocomplete="name" maxlength="60"></div>
      <div class="auth-field" id="emailField"><input id="authEmail" type="email" placeholder="Email address" autocomplete="email" inputmode="email" required></div>
      <div class="auth-field" id="passField"><input id="authPass" type="password" placeholder="Password" autocomplete="current-password" minlength="8" required></div>
      <div class="auth-error" id="authError"></div>
      <button class="btn primary" id="authSubmit" type="submit">Continue</button>
    </form>
    <div class="auth-switch" id="authSwitch"></div>
    <div class="auth-switch" id="forgotWrap"><a id="forgotLink">Forgot password?</a></div>
  </div>
  <div class="auth-foot">Your chats are private to your account</div>
</div>

<!-- ============ APP ============ -->
<div id="app" hidden>
  <aside id="sidebar" aria-label="Sidebar">
    <div class="sb-top">
      <button class="sb-logo" id="logoBtn" title="New chat"><svg class="logo"><use href="#logo"/></svg></button>
      <button class="icon-btn" id="collapseBtn" title="Close sidebar"><svg class="i"><use href="#i-sidebar"/></svg></button>
    </div>
    <nav class="sb-nav">
      <button class="sb-item" id="newChatBtn"><svg class="i"><use href="#i-new"/></svg>New chat<span class="kbd">Ctrl ⇧ O</span></button>
      <button class="sb-item" id="searchBtn"><svg class="i"><use href="#i-search"/></svg>Search chats<span class="kbd">Ctrl K</span></button>
      <button class="sb-item" id="libraryBtn"><svg class="i"><use href="#i-images"/></svg>Library</button>
    </nav>
    <div id="chatList"></div>
    <div class="sb-bottom">
      <button class="sb-item" id="installBtn" hidden><svg class="i"><use href="#i-install"/></svg>Install app</button>
      <button class="profile-btn" id="profileBtn">
        <span class="avatar" id="avatar">U</span>
        <span style="min-width:0;flex:1"><div class="nm" id="profileName">User</div><div class="pl">Personal · unlimited</div></span>
      </button>
    </div>
  </aside>
  <div id="scrim"></div>

  <main id="main" class="is-empty">
    <header id="topbar">
      <div class="left-tools">
        <button class="icon-btn mobile-only" id="menuBtn" title="Open sidebar"><svg class="i"><use href="#i-menu"/></svg></button>
        <button class="icon-btn desk-only" id="expandBtn" title="Open sidebar"><svg class="i"><use href="#i-sidebar"/></svg></button>
        <button class="icon-btn desk-only" id="newChatTop2" title="New chat"><svg class="i"><use href="#i-new"/></svg></button>
      </div>
      <button id="modelBtn" aria-haspopup="menu"><span class="brand app-name">ChatGPT</span><span class="mname" id="modelName">Auto</span><svg class="i sm"><use href="#i-chev"/></svg></button>
      <div class="right">
        <button class="icon-btn mobile-only" id="newChatTop" title="New chat"><svg class="i"><use href="#i-new"/></svg></button>
      </div>
    </header>

    <div id="scroller">
      <h1 id="greeting">What can I help with?</h1>
      <div id="thread" role="log" aria-live="polite"></div>
    </div>

    <div id="composerWrap">
      <div class="composer-inner">
        <form id="composer" autocomplete="off">
          <div id="attachRow"></div>
          <textarea id="input" rows="1" placeholder="Ask anything" aria-label="Message"></textarea>
          <div class="composer-bar">
            <button type="button" class="cbtn" id="plusBtn" title="Add photos, files and tools"><svg class="i"><use href="#i-plus"/></svg></button>
            <button type="button" class="tool-chip" id="toolChip" hidden title="Turn off image mode"><svg class="i sm ico"><use href="#i-palette"/></svg><svg class="i sm x"><use href="#i-x"/></svg>Image</button>
            <span class="spacer"></span>
            <button type="button" class="cbtn" id="micBtn" title="Dictate" hidden><svg class="i"><use href="#i-mic"/></svg></button>
            <button type="submit" class="cbtn" id="sendBtn" title="Send" disabled><svg class="i send-ico"><use href="#i-up"/></svg><svg class="i stop-ico"><use href="#i-stop"/></svg></button>
          </div>
        </form>
        <div id="suggestions"></div>
        <div class="disclaimer"><span class="app-name">ChatGPT</span> can make mistakes. Check important info.</div>
      </div>
    </div>
    <button id="toBottom" hidden title="Scroll to bottom"><svg class="i sm"><use href="#i-down"/></svg></button>
  </main>
</div>

<!-- menus -->
<div class="menu" id="modelMenu" hidden role="menu"></div>
<div class="menu" id="plusMenu" hidden role="menu">
  <button class="menu-item" data-act="attach"><svg class="i"><use href="#i-clip"/></svg>Add photos &amp; files</button>
  <button class="menu-item" data-act="image" id="plusImage"><svg class="i"><use href="#i-palette"/></svg>Create image</button>
</div>
<div class="menu" id="profileMenu" hidden role="menu">
  <div class="menu-label" id="profileEmail"></div>
  <button class="menu-item" data-act="settings"><svg class="i"><use href="#i-gear"/></svg>Settings</button>
  <button class="menu-item" data-act="personalize"><svg class="i"><use href="#i-sliders"/></svg>Customize</button>
  <button class="menu-item" data-act="admin" id="adminItem" hidden><svg class="i"><use href="#i-shield"/></svg>Admin</button>
  <button class="menu-item" data-act="install" id="installItem" hidden><svg class="i"><use href="#i-install"/></svg>Install app</button>
  <button class="menu-item" data-act="phone" id="phoneItem"><svg class="i"><use href="#i-install"/></svg><span>Open on phone</span></button>
  <div class="menu-sep"></div>
  <button class="menu-item" data-act="logout"><svg class="i"><use href="#i-logout"/></svg>Log out</button>
</div>
<div class="menu" id="chatMenu" hidden role="menu">
  <button class="menu-item" data-act="rename"><svg class="i"><use href="#i-edit"/></svg>Rename</button>
  <button class="menu-item" data-act="pin"><svg class="i"><use href="#i-pin"/></svg><span>Pin</span></button>
  <div class="menu-sep"></div>
  <button class="menu-item danger" data-act="delete"><svg class="i"><use href="#i-trash"/></svg>Delete</button>
</div>

<!-- dialogs -->
<dialog id="settingsDlg">
  <div class="dlg-head"><h2>Settings</h2><button class="icon-btn" data-close><svg class="i"><use href="#i-x"/></svg></button></div>
  <div class="settings-wrap">
    <div class="settings-tabs" id="settingsTabs"></div>
    <div class="settings-pane" id="settingsPane"></div>
  </div>
</dialog>
<dialog id="searchDlg">
  <div class="search-top"><svg class="i"><use href="#i-search"/></svg><input id="searchInput" placeholder="Search chats…"><button class="icon-btn" data-close><svg class="i"><use href="#i-x"/></svg></button></div>
  <div id="searchResults"></div>
</dialog>
<dialog id="libraryDlg">
  <div class="dlg-head"><h2>Library</h2><button class="icon-btn" data-close><svg class="i"><use href="#i-x"/></svg></button></div>
  <div class="dlg-body"><div class="lib-grid" id="libGrid"></div></div>
</dialog>
<dialog id="lightbox">
  <img id="lbImg" alt="">
  <div class="lb-tools">
    <button id="lbDownload" title="Download"><svg class="i"><use href="#i-download"/></svg></button>
    <button data-close title="Close"><svg class="i"><use href="#i-x"/></svg></button>
  </div>
</dialog>
<dialog id="phoneDlg">
  <div class="dlg-head"><h2>Open on your phone</h2><button class="icon-btn" data-close><svg class="i"><use href="#i-x"/></svg></button></div>
  <div class="dlg-body" id="phoneBody"></div>
</dialog>
<dialog id="confirmDlg">
  <div class="dlg-head"><h2 id="confirmTitle">Are you sure?</h2></div>
  <div class="dlg-body">
    <p id="confirmText"></p>
    <div id="confirmExtra"></div>
    <div class="dlg-actions"><button class="btn" data-close>Cancel</button><button class="btn danger solid" id="confirmOk">Delete</button></div>
  </div>
</dialog>

 * The page works without any key (free Pollinations AI + images).
 * Optional: add FREE keys for faster / smarter answers. The page tries them in order and

 */

  appName: 'ChatGPT',
  keys: {
    groq: '',        // free: https://console.groq.com/keys
    gemini: '',      // free: https://aistudio.google.com/apikey
    openrouter: '',  // free models: https://openrouter.ai/keys
  },
  // OmniRoute on this computer, e.g. 'http://localhost:20128/v1' (only when the page is opened on that PC)
  omniroute: { url: '', key: '' },

<script>
/* ChatGPT — in-browser backend for the single-file version (index.html).
 * Replaces the Node server so the page works on any static host or opened as a file:
 *  - accounts, chats and settings are stored in this browser (localStorage)
 *  - AI is called straight from the browser: OmniRoute (if reachable), free keys from
 *    CHATGPT_CONFIG, then Pollinations (no key). If one fails, the next one answers.
 * It answers the same /api/* requests the server does, so app.js runs unchanged.
 */
(function () {
  'use strict';
  window.STATIC_MODE = true;
  const CFG = window.CHATGPT_CONFIG || {};
  const KEYS = CFG.keys || {};
  const APP_NAME = CFG.appName || 'ChatGPT';
  const realFetch = window.fetch.bind(window);

  // ---------------- storage ----------------
  const mem = {};
  const ls = {
    get(k, d) { try { const v = localStorage.getItem('cgp:' + k); return v == null ? d : JSON.parse(v); } catch { return k in mem ? mem[k] : d; } },
    set(k, v) { try { localStorage.setItem('cgp:' + k, JSON.stringify(v)); return true; } catch { mem[k] = v; return false; } },
    del(k) { try { localStorage.removeItem('cgp:' + k); } catch { /* ignore */ } delete mem[k]; },
  };
  const now = () => Date.now();
  const uid = () => Math.random().toString(36).slice(2, 10) + now().toString(36);
  const today = () => new Date().toISOString().slice(0, 10);

  async function hashPw(pw, salt) {
    if (window.crypto && crypto.subtle) {
      const enc = new TextEncoder();
      const key = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
      const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode(salt), iterations: 100000, hash: 'SHA-256' }, key, 256);
      return btoa(String.fromCharCode(...new Uint8Array(bits)));
    }
    let h = 7; for (const c of salt + pw) h = (h * 31 + c.charCodeAt(0)) | 0; // pages without WebCrypto (plain http)
    return 'h' + h;
  }

  const users = () => ls.get('users', {});
  const saveUsers = (u) => ls.set('users', u);
  function currentUser() {
    const id = ls.get('session', null);
    return id ? Object.values(users()).find((u) => u.id === id) || null : null;
  }
  const publicUser = (u) => ({
    id: u.id, email: u.email, name: u.name, avatar: null, customInstructions: u.customInstructions || '',
    settings: u.settings || {}, isAdmin: false, hasPassword: true, createdAt: u.createdAt,
  });
  const chatsOf = (userId) => ls.get('chats:' + userId, []);
  const saveChats = (userId, list) => ls.set('chats:' + userId, list);
  const msgsOf = (chatId) => ls.get('msgs:' + chatId, []);
  function saveMsgs(chatId, list) {
    if (ls.set('msgs:' + chatId, list)) return;
    // Browser storage full: keep the text, drop big pasted photos from history.
    ls.set('msgs:' + chatId, list.map((m) => ({ ...m, attachments: (m.attachments || []).map((a) => (a.type === 'image' && a.url && a.url.startsWith('data:') ? { ...a, url: '' } : a)) })));
  }
  function bumpUsage(userId, field) {
    const k = `usage:${userId}:${today()}`;
    const u = ls.get(k, { msgs: 0, images: 0 });
    u[field] = (u[field] || 0) + 1;
    ls.set(k, u);
  }

  // ---------------- responses ----------------
  const json = (status, data) => new Response(JSON.stringify(data), { status, headers: { 'Content-Type': 'application/json' } });
  const fail = (status, message) => json(status, { error: message });
  const body = (init) => { try { return init && init.body ? JSON.parse(init.body) : {}; } catch { return {}; } };

  // ---------------- AI providers (browser) ----------------
  const OFFICIAL = new Set(['openai', 'anthropic', 'gemini', 'vertex', 'groq', 'cerebras', 'openrouter', 'mistral', 'codestral', 'deepseek',
    'xai', 'together', 'fireworks', 'deepinfra', 'nvidia', 'huggingface', 'sambanova', 'novita', 'cohere', 'perplexity', 'cloudflare-ai',
    'ollama-cloud', 'ollama', 'moonshot', 'kimi', 'zai', 'glm', 'minimax', 'alibaba', 'qwen-cloud', 'nebius', 'hyperbolic', 'pollinations']);

  const providers = [];
  const omni = CFG.omniroute || {};
  if (omni.url) {
    providers.push({ id: 'omniroute', label: 'OmniRoute', url: omni.url.replace(/\/+$/, '') + '/chat/completions', key: omni.key || '', models: [], discover: true });
  }
  if (KEYS.groq) {
    providers.push({ id: 'groq', label: 'Groq', url: 'https://api.groq.com/openai/v1/chat/completions', key: KEYS.groq, models: [
      { id: 'openai/gpt-oss-120b' }, { id: 'llama-3.3-70b-versatile' }, { id: 'meta-llama/llama-4-scout-17b-16e-instruct', vision: true }, { id: 'llama-3.1-8b-instant' }] });
  }
  if (KEYS.gemini) {
    providers.push({ id: 'gemini', label: 'Google Gemini', url: 'https://generativelanguage.googleapis.com/v1beta/openai/chat/completions', key: KEYS.gemini, models: [
      { id: 'gemini-2.5-flash', vision: true }, { id: 'gemini-2.5-flash-lite', vision: true }] });
  }
  if (KEYS.openrouter) {
    providers.push({ id: 'openrouter', label: 'OpenRouter', url: 'https://openrouter.ai/api/v1/chat/completions', key: KEYS.openrouter, models: [
      { id: 'openai/gpt-oss-120b:free' }, { id: 'meta-llama/llama-3.3-70b-instruct:free' }, { id: 'deepseek/deepseek-chat-v3.1:free' }], discover: true });
  }
  if (CFG.pollinations !== false) {
    // Without a key Pollinations serves GPT-OSS 20B ("openai-fast"); "openai" is its backup and gets photos.
    providers.push({ id: 'pollinations', label: 'Pollinations', url: 'https://text.pollinations.ai/openai', key: '', models: [
      { id: 'openai-fast', real: 'GPT-OSS 20B', effort: true }, { id: 'openai', real: 'GPT-OSS', vision: true, effort: true }] });
  }
  if (CFG.mock) {
    providers.unshift({ id: 'mock', label: 'Mock', mock: true, models: [{ id: 'mock-fast', vision: true }] });
  }

  async function discover(p) {
    try {
      if (p.id === 'omniroute') {
        const r = await realFetch(omni.url.replace(/\/+$/, '') + '/models', { headers: p.key ? { Authorization: 'Bearer ' + p.key } : {}, signal: AbortSignal.timeout(4000) });
        const j = await r.json();
        p.models = (j.data || []).filter((m) => OFFICIAL.has(String(m.owned_by || '').toLowerCase())
          && !/^(auto|combo)\//.test(m.id) && !(m.output_modalities && !m.output_modalities.includes('text')))
          .map((m) => ({ id: m.id, vision: (m.input_modalities || []).includes('image') }));
      } else if (p.id === 'openrouter') {
        const r = await realFetch('https://openrouter.ai/api/v1/models', { signal: AbortSignal.timeout(5000) });
        const j = await r.json();
        const free = (j.data || []).filter((m) => m.id.endsWith(':free'))
          .map((m) => ({ id: m.id, vision: (m.architecture?.input_modalities || []).includes('image') }));
        if (free.length) p.models = free.slice(0, 20);
      }
    } catch { /* keep the built-in list */ }
  }
  const ready = Promise.race([Promise.all(providers.filter((p) => p.discover).map(discover)), new Promise((r) => setTimeout(r, 5000))]);

  const allModels = () => providers.flatMap((p) => p.models.map((m) => ({ ...m, key: `${p.id}:${m.id}`, provider: p })));
  const cool = new Map();
  const isCool = (k) => (cool.get(k) || 0) > now();

  function prettyName(id) {
    let s = id.slice(id.lastIndexOf('/') + 1).replace(/:free$/, '');
    s = s.replace(/^gpt-oss/i, 'GPT-OSS').replace(/^gpt-/i, 'GPT-').replace(/-/g, ' ').replace(/\b(\d+(\.\d+)?)b\b/gi, (x) => x.toUpperCase());
    return s.replace(/\b[a-z]/g, (c) => c.toUpperCase()).replace(/\bInstruct\b|\bVersatile\b/g, '').trim() || id;
  }

  // Same menu as ChatGPT: GPT-6 with its thinking levels, then the older models.
  // Each name is backed by free models (first available answers, then the rest).
  const ALIASES = [
    { id: 'gpt-6-instant', name: 'GPT-6 Instant', short: 'Instant', group: 'GPT-6', description: 'Answers right away', effort: 'low',
      prefer: [/gemini-2\.5-flash(?!-lite)/, /groq:openai\/gpt-oss-120b/, /gpt-oss-120b/, /llama-3\.3-70b/, /pollinations:openai-fast/] },
    { id: 'gpt-6-medium', name: 'GPT-6 Medium', short: 'Medium', group: 'GPT-6', description: 'Thinks a little for better answers', effort: 'medium',
      prefer: [/gpt-oss-120b/, /gemini-2\.5-flash(?!-lite)/, /deepseek/, /llama-3\.3-70b/, /pollinations:openai-fast/] },
    { id: 'gpt-6-high', name: 'GPT-6 High', short: 'High', group: 'GPT-6', description: 'Thinks longer for harder problems', effort: 'high',
      prefer: [/gemini-[2-9][\d.]*-pro/, /deepseek-(r1|reasoner)/, /gpt-oss-120b/, /qwen/, /gemini-2\.5-flash(?!-lite)/, /pollinations:openai-fast/] },
    { id: 'gpt-6-extra-high', name: 'GPT-6 Extra High', short: 'Extra High', group: 'GPT-6', description: 'Thinks the longest for the hardest problems', effort: 'high',
      prefer: [/claude-(opus|sonnet|fable)/, /gemini-[2-9][\d.]*-pro/, /deepseek-(r1|reasoner)/, /gpt-oss-120b/, /gemini-2\.5-flash(?!-lite)/, /pollinations:openai-fast/] },
    { id: 'gpt-6-pro', name: 'GPT-6 Pro', short: 'Pro', group: 'GPT-6', description: 'Research-grade intelligence', effort: 'high',
      prefer: [/claude-(opus|fable)/, /claude-sonnet/, /gemini-[2-9][\d.]*-pro/, /deepseek-(r1|reasoner)/, /gpt-oss-120b/, /gemini-2\.5-flash(?!-lite)/, /pollinations:openai-fast/] },
    { id: 'gpt-5.6-sol', name: 'GPT-5.6 Sol', group: 'Other models', description: 'Previous flagship', effort: 'medium',
      prefer: [/llama-4-maverick/, /llama-3\.3-70b/, /gemini-2\.5-flash(?!-lite)/, /gpt-oss-120b/, /pollinations:openai-fast/] },
    { id: 'gpt-5.6-terra', name: 'GPT-5.6 Terra', group: 'Other models', description: 'Balanced and dependable', effort: 'low',
      prefer: [/mistral/, /llama-4-scout/, /llama-3\.3-70b/, /flash-lite/, /pollinations:openai-fast/] },
    { id: 'gpt-5.6-luna', name: 'GPT-5.6 Luna', group: 'Other models', description: 'Fast for everyday tasks', effort: 'low',
      prefer: [/llama-3\.1-8b/, /flash-lite/, /groq:openai\/gpt-oss-120b/, /pollinations:openai-fast/] },
  ];
  function chainFor(aliasKey, vision) {
    const alias = ALIASES.find((a) => 'alias:' + a.id === aliasKey) || ALIASES[0];
    const pool = allModels().filter((m) => !vision || m.vision);
    const out = [];
    for (const re of alias.prefer) for (const m of pool) if (re.test(m.key) && !out.includes(m)) out.push(m);
    for (const m of pool) if (!out.includes(m)) out.push(m);
    return { alias, chain: [...out.filter((m) => !isCool(m.key) && !isCool(m.provider.id)), ...out.filter((m) => isCool(m.key) || isCool(m.provider.id))] };
  }

  async function* streamModel(m, messages, signal, effort) {
    const p = m.provider;
    if (p.mock) {
      const last = messages[messages.length - 1];
      const asked = typeof last.content === 'string' ? last.content : (last.content.find((c) => c.type === 'text') || {}).text;
      for (const w of `Mock reply: "${String(asked).slice(0, 80)}"`.split(/(?<=\s)/)) {
        await new Promise((r) => setTimeout(r, 15)); if (signal.aborted) return; yield w;
      }
      return;
    }
    const headers = { 'Content-Type': 'application/json' };
    if (p.key) headers.Authorization = 'Bearer ' + p.key;
    const payload = { model: m.id, messages, stream: true };
    // Thinking level from the menu (Instant / Medium / High …) for models that take it.
    if (effort && (m.effort || /gpt-oss/i.test(m.id))) payload.reasoning_effort = effort;
    let r = await realFetch(p.url, { method: 'POST', headers, signal, body: JSON.stringify(payload) });
    if (r.status === 400 && payload.reasoning_effort) {
      delete payload.reasoning_effort;
      r = await realFetch(p.url, { method: 'POST', headers, signal, body: JSON.stringify(payload) });
    }
    if (!r.ok) {
      const e = new Error('HTTP ' + r.status); e.status = r.status; throw e;
    }
    const type = r.headers.get('content-type') || '';
    if (!type.includes('event-stream') || !r.body) {
      const t = await r.text();
      try { const j = JSON.parse(t); const c = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content; if (c) { yield c; return; } } catch { /* plain text */ }
      if (t.trim() && !/^\s*[{<]/.test(t)) { yield t; return; }
      throw new Error('empty');
    }
    const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line.startsWith('data:')) continue;
        const d = line.slice(5).trim();
        if (d === '[DONE]') return;
        try {
          const j = JSON.parse(d);
          const c = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
          if (c) yield c;
        } catch { /* keep-alive */ }
      }
    }
  }

  function systemPrompt(user, m) {
    let s = `You are ${APP_NAME}, a helpful, friendly and highly capable AI assistant. You are running on the model "${m.real || prettyName(m.id)}". If asked which model you are, say that truthfully. Current date: ${new Date().toDateString()}.
Reply in the user's language and script (Roman Urdu if they write Roman Urdu). Answer first, then details. Use Markdown (headings, lists, tables, fenced code with language). Be accurate; say so when unsure.`;
    if (user.customInstructions) s += `\n\nThe user's custom instructions:\n${user.customInstructions}`;
    return s;
  }

  function history(msgs, m) {
    const out = []; let used = 0;
    for (let i = msgs.length - 1; i >= 0 && out.length < 30; i--) {
      const x = msgs[i];
      if (x.role !== 'user' && x.role !== 'assistant') continue;
      if (x.role === 'assistant' && (x.status === 'error' || !x.content)) continue;
      let text = x.content || '';
      for (const a of x.attachments || []) if (a.type === 'file' && a.text) text += `\n\n[Attached file: ${a.name}]\n\`\`\`\n${a.text}\n\`\`\``;
      if (out.length && used + text.length > 40000) break;
      used += text.length;
      const imgs = x.role === 'user' ? (x.attachments || []).filter((a) => a.type === 'image' && a.url) : [];
      if (imgs.length && m.vision && out.length === 0) {
        out.push({ role: 'user', content: [...imgs.slice(0, 3).map((a) => ({ type: 'image_url', image_url: { url: a.url } })), { type: 'text', text: text || 'Describe this image.' }] });
      } else out.push({ role: x.role, content: text });
    }
    out.reverse();
    while (out.length && out[0].role !== 'user') out.shift();
    return out;
  }

  // ---------------- images ----------------
  const IMG_EN = /^\s*(?:please\s+|can you\s+|could you\s+)?(?:generate|create|make|draw|design|paint|render|sketch|imagine)\b[^?\n]{0,60}?\b(?:image|picture|photo|pic|logo|poster|wallpaper|illustration|drawing|painting|art(?:work)?|portrait|sketch|icon|banner|thumbnail|avatar|cartoon)s?\b/i;
  const IMG_UR = /\b(?:tasveer|tasvir|tasweer|image|photo|pic|picture|logo|poster|wallpaper|thumbnail)\b[^?\n]{0,50}?\b(?:bana(?:o|do|dein|den|na|ein)?|bna(?:o|do|dein|den)?|banaiye)\b/i;
  const wantsImage = (t) => /^\s*\/(image|img|imagine)\b/i.test(t) || IMG_EN.test(t) || IMG_UR.test(t);
  function imageUrl(prompt) {
    const t = prompt.toLowerCase();
    const aspect = /9:16|portrait|vertical|phone wallpaper|story|poster/.test(t) ? '9:16' : /16:9|landscape|wide|banner|youtube|thumbnail|desktop/.test(t) ? '16:9' : '1:1';
    const [w, h] = { '1:1': [1024, 1024], '16:9': [1344, 768], '9:16': [768, 1344] }[aspect];
    const clean = prompt.replace(/^\s*\/(image|img|imagine)\b/i, '').trim();
    if (CFG.mock) return { url: 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"><rect width="100%" height="100%" fill="#10a37f"/></svg>'), aspect };
    return { url: `https://image.pollinations.ai/prompt/${encodeURIComponent(clean + ', highly detailed, high quality')}?width=${w}&height=${h}&seed=${Math.floor(Math.random() * 1e9)}&nologo=true&model=flux`, aspect };
  }

  // ---------------- /api/chat (streamed like the server) ----------------
  function chatStream(user, b, init) {
    const action = ['send', 'regenerate', 'edit'].includes(b.action) ? b.action : 'send';
    const content = String(b.content || '').slice(0, 100000);
    let chats = chatsOf(user.id);
    let chat = b.chatId ? chats.find((c) => c.id === b.chatId) : null;
    if (b.chatId && !chat) return fail(404, 'Chat not found.');
    let msgs = chat ? msgsOf(chat.id) : [];
    let isNew = false, userMsg;
    if (action === 'send') {
      if (!content.trim() && !(b.attachments || []).length) return fail(400, 'Message is empty.');
      const atts = (b.attachments || []).slice(0, 10).map((a) => (a.type === 'image'
        ? { type: 'image', url: a.dataUrl, mime: (a.dataUrl.match(/^data:([^;]+)/) || [])[1] || 'image/jpeg', name: a.name || 'image' }
        : { type: 'file', name: a.name || 'file', text: String(a.text || '').slice(0, 120000), chars: String(a.text || '').length }));
      if (!chat) {
        isNew = true;
        const t = (content || (atts[0] && atts[0].name) || 'New chat').replace(/\s+/g, ' ').trim();
        chat = { id: uid(), title: t.length > 48 ? t.slice(0, 46) + '…' : t, pinned: false, updatedAt: now() };
        chats.unshift(chat);
      }
      userMsg = { id: uid(), role: 'user', content, attachments: atts, reasoning: '', status: 'done', note: '', rating: null, createdAt: now() };
      msgs.push(userMsg);
    } else {
      if (!chat) return fail(400, 'chatId is required.');
      let idx;
      if (action === 'edit') {
        idx = msgs.findIndex((m) => m.id === b.messageId && m.role === 'user');
        if (idx < 0) return fail(404, 'Message not found.');
        msgs[idx].content = content;
      } else {
        idx = msgs.map((m) => m.role).lastIndexOf('user');
        if (idx < 0) return fail(400, 'Nothing to regenerate.');
      }
      msgs = msgs.slice(0, idx + 1);
      userMsg = msgs[idx];
    }
    chat.updatedAt = now();
    saveChats(user.id, chats);
    saveMsgs(chat.id, msgs);

    const hasImages = (userMsg.attachments || []).some((a) => a.type === 'image');
    const image = !hasImages && (b.tool === 'image' || (b.tool !== 'chat' && wantsImage(userMsg.content)));
    const ac = new AbortController();
    if (init && init.signal) init.signal.addEventListener('abort', () => ac.abort(), { once: true });
    const enc = new TextEncoder();
    let ctl;
    const stream = new ReadableStream({ start(c) { ctl = c; }, cancel() { ac.abort(); } });
    const send = (ev, data) => { try { ctl.enqueue(enc.encode(`event: ${ev}\ndata: ${JSON.stringify(data)}\n\n`)); } catch { /* closed */ } };

    const finish = (msg) => {
      const list = msgsOf(chat.id); list.push(msg); saveMsgs(chat.id, list);
      send('done', { message: msg });
      if (isNew) send('title', { chatId: chat.id, title: chat.title });
      try { ctl.close(); } catch { /* closed */ }
    };

    (async () => {
      send('start', { chatId: chat.id, isNew, title: chat.title, userMessage: userMsg, assistantId, kind: image ? 'image' : 'chat' });
      if (image) {
        send('image_status', { stage: 'generating' });
        const { url, aspect } = imageUrl(userMsg.content);
        send('image_status', { stage: 'generating', aspect });
        bumpUsage(user.id, 'images');
        finish({ id: assistantId, role: 'assistant', content: '', reasoning: '', attachments: [{ type: 'image', url, aspect, prompt: userMsg.content }],

        return;
      }
      await ready;
      const { alias, chain } = chainFor(b.model, hasImages);
      if (!chain.length) {
        send('error', { message: 'No AI is available right now.' });
        finish({ id: assistantId, role: 'assistant', content: '', attachments: [], status: 'error', note: 'No AI is available right now.', createdAt: now() });
        return;
      }
      let text = '', used = null;
      const t0 = now();
      for (const m of chain.slice(0, 8)) {
        if (ac.signal.aborted) break;
        const one = new AbortController();
        const stop = () => one.abort();
        ac.signal.addEventListener('abort', stop, { once: true });
        let timer = setTimeout(stop, 25000);
        try {
          const messages = [{ role: 'system', content: systemPrompt(user, m) }, ...history(msgsOf(chat.id), m)];
          for await (const piece of streamModel(m, messages, one.signal, alias.effort)) {
            clearTimeout(timer); timer = setTimeout(stop, 90000);
            if (!used) { used = m; send('model', { key: b.model, name: alias.name, provider: m.provider.id, providerLabel: m.provider.label, tier: 'free', fallbackFrom: [] }); }
            text += piece; send('delta', { t: piece });
          }
          clearTimeout(timer);
          if (text) break;
          throw new Error('empty');
        } catch (e) {
          clearTimeout(timer);
          if (ac.signal.aborted) break;
          if (text) break; // keep what was already shown
          const st = e && e.status;
          if (st === 401 || st === 403) cool.set(m.provider.id, now() + 600000);
          else cool.set(m.key, now() + (st === 404 || st === 400 ? 600000 : 30000));
          used = null;
        } finally { ac.signal.removeEventListener('abort', stop); }
      }
      const status = ac.signal.aborted ? 'stopped' : text ? 'done' : 'error';
      if (status === 'done') bumpUsage(user.id, 'msgs');

      finish({ id: assistantId, role: 'assistant', content: text, reasoning: '', attachments: [], model: b.model,
        modelName: used ? alias.name : null, provider: used ? `${used.real || prettyName(used.id)} · ${used.provider.label}` : null,

    })();

    return new Response(stream, { status: 200, headers: { 'Content-Type': 'text/event-stream' } });
  }

  // ---------------- router ----------------
  async function handle(url, init) {
    const [path, qs] = url.split('?');
    const method = ((init && init.method) || 'GET').toUpperCase();
    const params = new URLSearchParams(qs || '');
    const user = currentUser();
    const need = () => (user ? null : fail(401, 'Please log in.'));

    if (path === '/healthz') return json(200, { ok: true, app: 'chatgpt-personal', name: APP_NAME });
    if (path === '/api/config') return json(200, { appName: APP_NAME, signupEnabled: true, googleEnabled: false, resetEnabled: false, imagesEnabled: true });

    if (path === '/api/auth/signup' && method === 'POST') {
      const b = body(init);
      const email = String(b.email || '').trim().toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return fail(400, 'Please enter a valid email address.');
      if (String(b.password || '').length < 8) return fail(400, 'Password must be at least 8 characters.');
      const all = users();
      if (all[email]) return fail(409, 'An account with this email already exists. Try logging in.');
      const salt = uid();
      all[email] = { id: uid(), email, name: String(b.name || '').trim() || email.split('@')[0], salt, hash: await hashPw(b.password, salt), createdAt: now(), customInstructions: '', settings: {} };

      return json(201, { user: publicUser(all[email]) });
    }
    if (path === '/api/auth/login' && method === 'POST') {
      const b = body(init);
      const u = users()[String(b.email || '').trim().toLowerCase()];
      if (!u || (await hashPw(String(b.password || ''), u.salt)) !== u.hash) return fail(401, 'Incorrect email or password.');

    }

    if (path === '/api/auth/forgot' || path === '/api/auth/reset') return fail(400, 'Password reset is not available in this version.');

    const denied = need(); if (denied) return denied;

    if (path === '/api/me' && method === 'GET') {
      const u = ls.get(`usage:${user.id}:${today()}`, { msgs: 0, images: 0 });
      return json(200, { user: publicUser(user), usage: { messages: u.msgs || 0, premium: 0, images: u.images || 0 }, limits: { messages: 0, premium: 0, images: 0 } });
    }
    if (path === '/api/me' && method === 'PATCH') {
      const b = body(init); const all = users(); const u = all[user.email];
      if (b.name !== undefined) u.name = String(b.name).trim().slice(0, 60) || u.name;
      if (b.customInstructions !== undefined) u.customInstructions = String(b.customInstructions).slice(0, 3000);
      if (b.settings) u.settings = { ...u.settings, ...b.settings };
      saveUsers(all);
      return json(200, { user: publicUser(u) });
    }
    if (path === '/api/me/password' && method === 'POST') {
      const b = body(init); const all = users(); const u = all[user.email];
      if ((await hashPw(String(b.currentPassword || ''), u.salt)) !== u.hash) return fail(400, 'Current password is incorrect.');
      if (String(b.newPassword || '').length < 8) return fail(400, 'Password must be at least 8 characters.');
      u.salt = uid(); u.hash = await hashPw(b.newPassword, u.salt); saveUsers(all);
      return json(200, { ok: true });
    }
    if (path === '/api/me' && method === 'DELETE') {
      const b = body(init); const all = users(); const u = all[user.email];
      if ((await hashPw(String(b.password || ''), u.salt)) !== u.hash) return fail(400, 'Password is incorrect.');
      for (const c of chatsOf(u.id)) ls.del('msgs:' + c.id);
      ls.del('chats:' + u.id); delete all[u.email]; saveUsers(all); ls.del('session');
      return json(200, { ok: true });
    }

    if (path === '/api/models') {
      await ready;
      const any = allModels().length > 0;
      return json(200, {
        default: 'alias:' + ALIASES[0].id, images: true, openaiConfigured: false, isAdmin: false, aliasMode: true,
        models: ALIASES.map((a) => ({ key: 'alias:' + a.id, name: a.name, short: a.short || a.name, provider: 'alias', providerLabel: '', tier: 'free', group: a.group, vision: false, description: a.description, featured: false, available: any })),
      });
    }

    if (path === '/api/chats' && method === 'GET') {
      const list = chatsOf(user.id).slice().sort((a, b) => (b.pinned - a.pinned) || (b.updatedAt - a.updatedAt));
      return json(200, { chats: list });
    }
    if (path === '/api/chats' && method === 'DELETE') {
      for (const c of chatsOf(user.id)) ls.del('msgs:' + c.id);
      saveChats(user.id, []);
      return json(200, { ok: true });
    }
    let m = path.match(/^\/api\/chats\/([\w-]+)$/);
    if (m) {
      const chats = chatsOf(user.id); const chat = chats.find((c) => c.id === m[1]);
      if (!chat) return fail(404, 'Chat not found.');
      if (method === 'GET') return json(200, { chat, messages: msgsOf(chat.id) });
      if (method === 'PATCH') {
        const b = body(init);
        if (typeof b.title === 'string' && b.title.trim()) chat.title = b.title.trim().slice(0, 120);
        if (typeof b.pinned === 'boolean') chat.pinned = b.pinned;
        saveChats(user.id, chats); return json(200, { ok: true });
      }
      if (method === 'DELETE') { ls.del('msgs:' + chat.id); saveChats(user.id, chats.filter((c) => c !== chat)); return json(200, { ok: true }); }
    }
    if (path === '/api/search') {
      const q = (params.get('q') || '').toLowerCase().trim();
      const results = [];
      for (const c of chatsOf(user.id)) {
        const hit = msgsOf(c.id).find((x) => (x.content || '').toLowerCase().includes(q));
        if (c.title.toLowerCase().includes(q) || hit) results.push({ id: c.id, title: c.title, updatedAt: c.updatedAt, snippet: hit ? hit.content.slice(0, 300) : '' });
      }
      return json(200, { results: results.slice(0, 40) });
    }
    m = path.match(/^\/api\/messages\/([\w-]+)\/rating$/);

      for (const c of chatsOf(user.id)) {

    }
    if (path === '/api/images') {
      const images = [];
      for (const c of chatsOf(user.id)) for (const x of msgsOf(c.id)) for (const a of x.attachments || []) if (x.role === 'assistant' && a.type === 'image') images.push({ url: a.url, createdAt: x.createdAt });
      return json(200, { images: images.sort((a, b) => b.createdAt - a.createdAt) });
    }
    if (path === '/api/lan') return json(200, { urls: [], publicUrl: /^https?:/.test(location.origin) ? location.href.split('#')[0] : null });
    if (path === '/api/chat' && method === 'POST') return chatStream(user, body(init), init);
    if (path.startsWith('/api/admin')) return fail(403, 'Admins only.');
    return fail(404, 'Not found.');
  }

  window.fetch = function (input, init) {
    const url = typeof input === 'string' ? input : (input && input.url) || '';
    if (url.startsWith('/api/') || url === '/healthz') return handle(url, init || {});
    return realFetch(input, init);
  };
})();

<script type="module">
// ChatGPT — client app (vanilla JS, no build step).
/* global marked, DOMPurify, hljs */

// ---------------- utilities ----------------
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const icon = (id, cls = 'i') => `<svg class="${cls}"><use href="#${id}"/></svg>`;
const isTouch = () => matchMedia('(hover: none) and (pointer: coarse)').matches;
const isMobile = () => matchMedia('(max-width: 768px)').matches;
const store = {
  get(k, d = null) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

function toast(msg, isErr = false) {
  const el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err' : '');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, isErr ? 4000 : 2200);
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  }
}

// ---------------- state ----------------
const S = {
  config: { appName: 'ChatGPT' }, me: null, usage: null, limits: null,
  models: [], imagesEnabled: false, openaiConfigured: false, chats: [], chatId: null, messages: [],
  model: store.get('model', null), tool: null, attachments: [], streaming: null,
  sendOnEnter: store.get('sendOnEnter', '1') === '1',
};

// ---------------- API ----------------
async function api(path, { method = 'GET', body, signal } = {}) {
  const res = await fetch(path, {
    method, signal, credentials: 'same-origin',
    headers: body !== undefined ? { 'Content-Type': 'application/json' } : {},
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch {}
  if (res.status === 401 && !path.startsWith('/api/auth') && path !== '/api/me') { showAuth('login'); }
  if (!res.ok) { const e = new Error(data?.error || `Request failed (${res.status})`); e.status = res.status; throw e; }
  return data;
}

// ---------------- theme ----------------
function themePref() { return store.get('theme', 'system'); }
function applyTheme(pref = themePref()) {
  const dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applyTheme());

// ---------------- markdown ----------------
let streamingRender = false;
marked.use({
  gfm: true, breaks: true,
  renderer: {
    code({ text, lang }) {
      const language = String(lang || '').trim().split(/\s+/)[0].toLowerCase();
      let html;
      try {
        if (language && hljs.getLanguage(language)) html = hljs.highlight(text, { language, ignoreIllegals: true }).value;
        else if (!streamingRender && text.length < 8000) html = hljs.highlightAuto(text).value;
        else html = esc(text);
      } catch { html = esc(text); }
      return `<div class="code-block"><div class="code-head"><span>${esc(language || 'code')}</span><button type="button" class="copy-code">${icon('i-copy')}<span>Copy code</span></button></div><pre><code class="hljs">${html}</code></pre></div>`;
    },
  },
});
DOMPurify.addHook('afterSanitizeAttributes', (node) => {
  if (node.tagName === 'A' && node.getAttribute('href')) { node.setAttribute('target', '_blank'); node.setAttribute('rel', 'noopener noreferrer'); }
});

let katexState = 'idle';
function ensureKatex() {
  if (katexState !== 'idle') return;
  katexState = 'loading';
  const base = 'https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/';
  const link = document.createElement('link'); link.rel = 'stylesheet'; link.href = base + 'katex.min.css'; document.head.appendChild(link);
  const s = document.createElement('script'); s.src = base + 'katex.min.js';
  s.onload = () => { katexState = 'ready'; if (!S.streaming) renderThread(); };
  s.onerror = () => { katexState = 'failed'; };
  document.head.appendChild(s);
}

function extractMath(src) {
  const maths = [];
  const ph = (tex, display, raw) => { maths.push({ tex, display, raw }); return `MATHPH${maths.length - 1}X`; };
  const parts = src.split(/(```[\s\S]*?(?:```|$)|`[^`\n]*`)/g);
  for (let i = 0; i < parts.length; i += 2) {
    parts[i] = parts[i]
      .replace(/\$\$([\s\S]+?)\$\$/g, (m, a) => ph(a, true, m))
      .replace(/\\\[([\s\S]+?)\\\]/g, (m, a) => ph(a, true, m))
      .replace(/\\\(([\s\S]+?)\\\)/g, (m, a) => ph(a, false, m))
      .replace(/(^|[^\\$\w])\$(?=\S)([^$\n]+?)(?<=\S)\$(?![\w$])/g, (m, pre, a) => (/^\d+([.,]\d+)?$/.test(a) ? m : pre + ph(a, false, m.slice(pre.length))));
  }
  return { text: parts.join(''), maths };
}

function renderMarkdown(src, streaming = false) {
  streamingRender = streaming;
  const { text, maths } = extractMath(src || '');
  let html = DOMPurify.sanitize(marked.parse(text));
  if (maths.length) {
    if (katexState === 'ready') {
      html = html.replace(/MATHPH(\d+)X/g, (_, i) => {
        const m = maths[+i];
        try { return window.katex.renderToString(m.tex, { displayMode: m.display, throwOnError: false }); } catch { return esc(m.raw); }
      });
    } else {
      if (katexState === 'idle') ensureKatex();
      html = html.replace(/MATHPH(\d+)X/g, (_, i) => esc(maths[+i].raw));
    }
  }
  streamingRender = false;
  return html;
}

function plainText(md) {
  return String(md || '').replace(/```[\s\S]*?```/g, ' code block. ').replace(/[#*_`>|~-]+/g, ' ').replace(/\[(.*?)\]\(.*?\)/g, '$1').replace(/\s+/g, ' ').trim();
}

// ---------------- boot ----------------
async function boot() {
  applyTheme();
  registerSW();
  try { S.config = await api('/api/config'); } catch {}
  setAppName(S.config.appName || 'ChatGPT');
  const params = new URLSearchParams(location.search);
  const resetToken = params.get('reset');
  const authErr = params.get('auth_error');
  if (resetToken || authErr) history.replaceState({}, '', location.pathname);
  if (resetToken) { hideSplash(); showAuth('reset', resetToken); return; }
  try {
    const me = await api('/api/me');
    await enterApp(me);
  } catch {
    showAuth('login');
    if (authErr) {
      $('#authError').textContent = { google: 'Google sign-in failed. Please try again.', closed: 'Sign-ups are closed.', disabled: 'This account is disabled.' }[authErr] || 'Sign-in failed.';
    }
  }
  hideSplash();
}
function hideSplash() { $('#splash').hidden = true; }
function setAppName(name) {
  S.config.appName = name;
  $$('.app-name').forEach((el) => { el.textContent = name; });
  document.title = name;
}

// URLs: the server version uses /c/<id>; the single-file version (window.STATIC_MODE)
// uses #/c/<id>, which works on any static host and when opened as a file.
function currentPath() { return window.STATIC_MODE ? (location.hash.replace(/^#/, '') || '/') : location.pathname; }
function nav(path, replace = false) {
  const url = window.STATIC_MODE ? (path === '/' ? location.pathname + location.search : `#${path}`) : path;
  history[replace ? 'replaceState' : 'pushState']({}, '', url);
}

function registerSW() {
  if ('serviceWorker' in navigator && location.protocol !== 'file:' && !window.STATIC_MODE) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
}

// ---------------- auth ----------------
let authMode = 'login';
let resetTokenValue = null;

function showAuth(mode = 'login', token = null) {
  if (S.streaming) S.streaming.ctrl.abort();
  S.me = null;
  $('#app').hidden = true;
  $('#auth').hidden = false;
  resetTokenValue = token;
  setAuthMode(mode);
}

function setAuthMode(mode) {
  authMode = mode;
  const app = S.config.appName;
  const cfg = S.config;
  $('#authError').textContent = '';
  $('#authError').className = 'auth-error';
  const show = (sel, on) => { $(sel).hidden = !on; };
  const titles = {
    login: ['Welcome back', `Log in to continue to ${app}`, 'Continue'],
    signup: ['Create an account', `Free to use — every model in one place`, 'Continue'],
    forgot: ['Reset your password', 'Enter your email and we’ll send you a reset link.', 'Send reset link'],
    reset: ['Set a new password', 'Choose a password with at least 8 characters.', 'Save password'],
  }[mode];
  $('#authTitle').textContent = titles[0];
  $('#authSub').textContent = titles[1];
  $('#authSubmit').textContent = titles[2];
  show('#nameField', mode === 'signup');
  show('#emailField', mode !== 'reset');
  show('#passField', mode !== 'forgot');
  $('#authPass').autocomplete = mode === 'login' ? 'current-password' : 'new-password';
  $('#authPass').placeholder = mode === 'reset' ? 'New password' : 'Password';
  const google = cfg.googleEnabled && (mode === 'login' || mode === 'signup');
  show('#googleBtn', google);
  show('#authDivider', google);
  show('#forgotWrap', mode === 'login' && cfg.resetEnabled);
  const sw = $('#authSwitch');
  if (mode === 'login') sw.innerHTML = cfg.signupEnabled === false ? '' : `Don’t have an account? <a data-mode="signup">Sign up</a>`;
  else if (mode === 'signup') sw.innerHTML = `Already have an account? <a data-mode="login">Log in</a>`;
  else sw.innerHTML = `<a data-mode="login">Back to log in</a>`;
  setTimeout(() => (mode === 'signup' ? $('#authName') : mode === 'reset' ? $('#authPass') : $('#authEmail')).focus(), 50);
}

$('#authSwitch').addEventListener('click', (e) => { const a = e.target.closest('[data-mode]'); if (a) setAuthMode(a.dataset.mode); });
$('#forgotLink').addEventListener('click', () => setAuthMode('forgot'));
$('#googleBtn').addEventListener('click', () => { location.href = '/api/auth/google'; });

$('#authForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('#authSubmit');
  const errEl = $('#authError');
  errEl.textContent = ''; errEl.className = 'auth-error';
  const email = $('#authEmail').value.trim();
  const password = $('#authPass').value;
  const name = $('#authName').value.trim();
  if (authMode !== 'reset' && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { errEl.textContent = 'Please enter a valid email address.'; return; }
  if (authMode !== 'forgot' && password.length < 8) { errEl.textContent = 'Password must be at least 8 characters.'; return; }
  btn.disabled = true;
  try {
    if (authMode === 'forgot') {
      await api('/api/auth/forgot', { method: 'POST', body: { email } });
      errEl.className = 'auth-note';
      errEl.textContent = 'If an account exists for that email, a reset link is on its way.';
      return;
    }
    const path = { login: '/api/auth/login', signup: '/api/auth/signup', reset: '/api/auth/reset' }[authMode];
    const body = authMode === 'reset' ? { token: resetTokenValue, password } : { email, password, name };
    await api(path, { method: 'POST', body });
    $('#authPass').value = '';
    const me = await api('/api/me');
    await enterApp(me);
  } catch (err) {
    errEl.textContent = err.message;
  } finally { btn.disabled = false; }
});

async function logout() {
  try { await api('/api/auth/logout', { method: 'POST' }); } catch {}
  S.chats = []; S.messages = []; S.chatId = null;
  nav('/', true);
  showAuth('login');
}

// ---------------- app shell ----------------
async function enterApp(me) {

const GREETINGS = ['What can I help with?', 'What’s on your mind today?', 'Where should we begin?', 'Ready when you are.', 'How can I help, {name}?'];
function setEmpty(empty) {

function newChat({ push = true } = {}) {
  if (S.streaming) S.streaming.ctrl.abort();

async function openChat(id, { push = true } = {}) {

  setEmpty(false);

// ---------------- sidebar ----------------
function groupLabel(ts) {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  const t0 = d.getTime(), day = 86400000;
  if (ts >= t0) return 'Today';
  if (ts >= t0 - day) return 'Yesterday';
  if (ts >= t0 - 7 * day) return 'Previous 7 days';
  if (ts >= t0 - 30 * day) return 'Previous 30 days';
  return new Date(ts).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
}

function renderChatList() {
  const el = $('#chatList');
  if (!S.chats.length) { el.innerHTML = '<div class="sb-empty">Your chats will show up here.</div>'; return; }
  let html = '', last = null;
  for (const c of S.chats) {
    const g = c.pinned ? 'Pinned' : groupLabel(c.updatedAt);
    if (g !== last) { html += `<div class="sb-group">${esc(g)}</div>`; last = g; }
    html += `<div class="chat-item${c.id === S.chatId ? ' active' : ''}" data-id="${esc(c.id)}">${c.pinned ? icon('i-pin', 'i sm pin') : ''}<span class="t">${esc(c.title)}</span><button class="more" data-more title="Options">${icon('i-more', 'i sm')}</button></div>`;
  }
  el.innerHTML = html;
}

$('#chatList').addEventListener('click', (e) => {
  const item = e.target.closest('.chat-item');
  if (!item || item.querySelector('input')) return;
  if (e.target.closest('[data-more]')) { e.stopPropagation(); openChatMenu(item); return; }
  if (item.dataset.id !== S.chatId) openChat(item.dataset.id); else closeSidebarMobile();
});

let menuChatId = null;
function openChatMenu(item) {
  menuChatId = item.dataset.id;
  const chat = S.chats.find((c) => c.id === menuChatId);
  $('#chatMenu [data-act="pin"] span').textContent = chat?.pinned ? 'Unpin' : 'Pin';
  item.classList.add('menu-open');
  openMenu($('#chatMenu'), item.querySelector('[data-more]'), { onClose: () => item.classList.remove('menu-open') });
}

$('#chatMenu').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const id = menuChatId; closeMenus();
  const chat = S.chats.find((c) => c.id === id); if (!chat) return;
  if (b.dataset.act === 'rename') startRename(id);
  if (b.dataset.act === 'pin') {
    chat.pinned = !chat.pinned;
    sortChats(); renderChatList();
    api(`/api/chats/${id}`, { method: 'PATCH', body: { pinned: chat.pinned } }).catch((err) => toast(err.message, true));
  }
  if (b.dataset.act === 'delete') {
    const ok = await confirmDialog({ title: 'Delete chat?', text: `This will delete “${chat.title}”.`, ok: 'Delete' });
    if (!ok) return;
    try {
      await api(`/api/chats/${id}`, { method: 'DELETE' });
      S.chats = S.chats.filter((c) => c.id !== id);
      if (S.chatId === id) newChat(); else renderChatList();
    } catch (err) { toast(err.message, true); }
  }
});

function startRename(id) {
  const item = $(`.chat-item[data-id="${CSS.escape(id)}"]`);
  const chat = S.chats.find((c) => c.id === id);
  if (!item || !chat) return;
  const t = item.querySelector('.t');
  const input = document.createElement('input');
  input.value = chat.title; input.maxLength = 120;
  t.replaceWith(input); input.focus(); input.select();
  let done = false;
  const finish = async (save) => {
    if (done) return; done = true;
    const v = input.value.trim();
    if (save && v && v !== chat.title) {
      chat.title = v;
      api(`/api/chats/${id}`, { method: 'PATCH', body: { title: v } }).catch((err) => toast(err.message, true));
      if (S.chatId === id) document.title = `${v} · ${S.config.appName}`;
    }
    renderChatList();
  };
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') finish(true); if (e.key === 'Escape') finish(false); });
  input.addEventListener('blur', () => finish(true));
}

function sortChats() { S.chats.sort((a, b) => (b.pinned - a.pinned) || (b.updatedAt - a.updatedAt)); }
function touchChat(id, title) {
  let c = S.chats.find((x) => x.id === id);
  if (!c) { c = { id, title: title || 'New chat', pinned: false, updatedAt: Date.now() }; S.chats.unshift(c); }
  c.updatedAt = Date.now();
  if (title) c.title = title;
  sortChats(); renderChatList();
}

// ---------------- menus ----------------
let openMenuState = null;
function openMenu(menu, anchor, { placement = 'below', align = 'start', onClose } = {}) {
  closeMenus();
  menu.hidden = false;
  const r = anchor.getBoundingClientRect();
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  let left = align === 'end' ? r.right - mw : r.left;
  left = Math.max(8, Math.min(left, innerWidth - mw - 8));
  let top = placement === 'above' ? r.top - mh - 6 : r.bottom + 6;
  if (top + mh > innerHeight - 8) top = Math.max(8, r.top - mh - 6);
  if (top < 8) top = 8;
  menu.style.left = `${left}px`;
  menu.style.top = `${top}px`;
  openMenuState = { menu, onClose };
}
function closeMenus() {
  if (!openMenuState) return;
  openMenuState.menu.hidden = true;
  openMenuState.onClose?.();
  openMenuState = null;
}
document.addEventListener('mousedown', (e) => { if (openMenuState && !openMenuState.menu.contains(e.target)) closeMenus(); });
document.addEventListener('touchstart', (e) => { if (openMenuState && !openMenuState.menu.contains(e.target)) closeMenus(); }, { passive: true });
window.addEventListener('resize', closeMenus);

function currentModel() { return S.models.find((m) => m.key === S.model) || null; }
function renderModelBtn() {
  const m = currentModel();
  $('#modelName').textContent = m ? m.name : 'Auto';
  $('#input').placeholder = S.tool === 'image' ? 'Describe an image' : 'Ask anything';
}

function modelRow(m, selected) {
  const badge = '';
  return `<button class="model-row${m.available === false ? ' off' : ''}" data-key="${esc(m.key)}" data-search="${esc((m.name + ' ' + (m.providerLabel || '') + ' ' + m.key).toLowerCase())}">
    <span class="mt"><span class="mn">${esc(m.short || m.name)} ${badge}${m.vision ? `<span title="Can see images">${icon('i-eye', 'i sm')}</span>` : ''}</span>
    <span class="md2">${esc(m.description)}${m.available === false ? ' · busy right now' : ''}</span></span>
    ${selected ? icon('i-check', 'i sm') : ''}</button>`;
}

function renderModelMenu() {
  const menu = $('#modelMenu');
  let html = '';
  if (S.models.length > 8) html += '<div class="search"><input id="modelSearch" placeholder="Search models" autocomplete="off"></div>';
  // Groups arrive from the server already ordered: ChatGPT models first.
  const groups = new Map();
  for (const m of S.models) {
    const g = m.group || m.providerLabel;
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(m);
  }
  const chatgpt = groups.get('ChatGPT models');
  if (chatgpt) {
    html += '<div class="menu-label" data-group>ChatGPT models</div>';
    for (const m of chatgpt) html += modelRow(m, S.model === m.key);
    groups.delete('ChatGPT models');
  }
  if (!S.aliasMode) {
    html += '<div class="menu-label" data-group>Free & fast</div>';
    html += modelRow({ key: 'auto', name: 'Auto', description: 'Picks the fastest free model that’s available right now', tier: 'free' }, S.model === 'auto');
  }
  const featured = S.models.filter((m) => m.featured);
  if (featured.length) {
    html += '<div class="menu-label" data-group>Recommended</div>';
    for (const m of featured) html += modelRow(m, S.model === m.key);
  }
  for (const [g, list] of groups) {
    html += `<div class="menu-label" data-group>${esc(g)}</div>`;
    for (const m of list) html += modelRow(m, S.model === m.key);
  }
  if (!S.models.length) html += '<div class="menu-label">No models are configured on the server yet.</div>';
  menu.innerHTML = html;
  const search = $('#modelSearch');
  if (search) {
    search.addEventListener('input', () => {
      const q = search.value.trim().toLowerCase();
      $$('.model-row', menu).forEach((r) => { r.hidden = q && !(r.dataset.search || '').includes(q) && !(r.dataset.key === 'auto' && 'auto'.includes(q)); });
      $$('[data-group]', menu).forEach((l) => { l.hidden = !!q; });
    });
  }
}

$('#modelBtn').addEventListener('click', async (e) => {

  if (openMenuState?.menu === $('#modelMenu')) { closeMenus(); return; }
  renderModelMenu();
  openMenu($('#modelMenu'), $('#modelBtn'));
  if (!isTouch()) $('#modelSearch')?.focus();
  // refresh in the background (new providers connected in OmniRoute appear here)
  api('/api/models').then((d) => {
    S.models = d.models; S.imagesEnabled = d.images; $('#plusImage').hidden = !S.imagesEnabled;
    if (openMenuState?.menu === $('#modelMenu') && !$('#modelSearch')?.value) renderModelMenu();
  }).catch(() => {});
});
$('#modelMenu').addEventListener('click', (e) => {

  S.model = r.dataset.key;
  store.set('model', S.model);
  closeMenus();
